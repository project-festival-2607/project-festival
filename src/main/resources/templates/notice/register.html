<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/libs/toastui-editor-3.2.2/css/toastui-editor.min.css}" />
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <!--                모든 inner는 class="container" 로 맞춤        -->
        <!--        이 안에서 작업        -->
    <h1>Register Page</h1>

        <form th:action="@{/notice/register}" method="post" id="registerForm">
            제목: <input type="text" name="title" id="title" placeholder="">
<!--            <input value="작성자" readonly>-->
            <!-- 에디터는 폼 필드가 아니므로, 전송 시점에 마크다운을 채워 넣어서 함께 전송 -->
            <input type="hidden" name="content" id="content">

            <div class="form-check">
                <input type="checkbox" class="form-check-input" name="highlight" id="highlight" value="true">
                <!-- 체크 해제 시에도 highlight=false로 바인딩되도록 하는 스프링의 필드 마커 -->
                <input type="hidden" name="_highlight" value="on">
                <label class="form-check-label" for="highlight">하이라이트</label>
            </div>

            <!-- 토스트 에디터 구현-->
            <div id="editor">

            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a th:href="@{/notice/list}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" id="btn" class="btn btn-primary">전송</button>
            </div>

        </form>

        <script th:src="@{/libs/toastui-editor-3.2.2/js/toastui-editor-all.min.js}"></script>

        <script th:src="@{/js/support/adminBoard.js}"></script>
    </div>
</div>
</body>
</html>
