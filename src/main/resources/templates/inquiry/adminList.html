<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<body>
<div layout:fragment="content">
    <div class="container">
        <h1 class="mb-3">문의 관리 (답변 대기 순)</h1>
        <!-- ponytail: 실제 admin 관리 페이지 생기기 전까지의 임시 큐 - 먼저 들어온 순서(오래된 순)로 정렬 -->

        <div class="d-flex justify-content-between align-items-center mb-3">
            <form th:action="@{/inquiry/admin/list}" method="get" class="d-flex gap-2">
                <select name="searchType" class="form-select" style="max-width: 120px;">
                    <option value="ino" th:selected="${searchType == 'ino'}">아이디</option>
                    <option value="title" th:selected="${searchType == null or searchType == 'title'}">제목</option>
                </select>
                <input type="text" name="keyword" class="form-control" placeholder="검색어" th:value="${keyword}">
                <button type="submit" class="btn btn-outline-primary">검색</button>
            </form>

            <!-- 검색과는 별개인 답변 상태 필터 - 기본은 전체 노출 -->
            <form th:action="@{/inquiry/admin/list}" method="get">
                <input type="hidden" name="searchType" th:value="${searchType}">
                <input type="hidden" name="keyword" th:value="${keyword}">
                <select name="answered" class="form-select form-select-sm" style="width: 120px;"
                        onchange="this.form.submit()">
                    <option value="" th:selected="${answered == null or answered == ''}">전체</option>
                    <option value="done" th:selected="${answered == 'done'}">답변완료</option>
                    <option value="pending" th:selected="${answered == 'pending'}">답변대기</option>
                </select>
            </form>
        </div>

        <table class="table table-hover align-middle">
            <thead>
            <tr>
                <th style="width: 80px;">아이디</th>
                <th>제목</th>
                <th style="width: 160px;">문의 시간</th>
                <th style="width: 100px;">상태</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="inquiry : ${inquiries}">
                <td th:text="${inquiry.ino}"></td>
                <td>
                    <a th:href="@{/inquiry/admin/detail/{ino}(ino=${inquiry.ino})}" th:text="${inquiry.title}"></a>
                </td>
                <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <span th:if="${inquiry.comment != null}" class="badge bg-success">답변완료</span>
                    <span th:unless="${inquiry.comment != null}" class="badge bg-secondary">답변대기</span>
                </td>
            </tr>
            <tr th:if="${inquiries.isEmpty()}">
                <td colspan="4" class="text-center text-muted">접수된 문의가 없습니다.</td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
