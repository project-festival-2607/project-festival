<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="job-seeker-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 200px;"> <!-- 아이디 -->
        <col style="width: 115px;"> <!-- 이름 -->
        <col style="width: 120px;"> <!-- 전화번호 -->
        <col style="width: 32px;">  <!-- (전화번호 확인) -->
        <col style="width: 250px;"> <!-- 이메일 -->
        <col style="width: 80px;">  <!-- 상태 -->
        <col style="width: 135px;"> <!-- 생성일시 -->
        <col style="width: 135px;"> <!-- 수정일시 -->
        <col style="width: 135px;"> <!-- 최근접속일시 -->
        <col style="width: 135px;"> <!-- 삭제일시 -->
        <col style="width: 90px;">  <!-- 포인트 -->
        <col style="width: 110px;"> <!-- 소셜 -->
        <col style="width: 75px;">  <!-- 성별 -->
        <col style="width: 100px;"> <!-- 생년월일 -->
        <col style="width: 300px;"> <!-- 도로명주소 -->
        <col style="width: 300px;"> <!-- 상세주소 -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">아이디</th>
        <th scope="col">이름</th>
        <th colspan="2" scope="col">휴대전화번호</th>
        <th scope="col">이메일</th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>상태</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.status == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="statusFilterDropdownList">
                <li>
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.status == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: member-status(null, false, true)}"></th:block>
                  </button>
                </li>
                <li th:each="status: ${memberStatusList}">
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.status != null and form.status == status.name} ? 'active'"
                          th:data-value="${status.name}"
                          type="button">
                    <th:block
                      th:replace="~{admin/fragments/badge :: member-status(${status}, false, false)}"></th:block>
                  </button>
                </li>
                <li>
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          data-value="DELETED"
                          th:classappend="${form.status != null and form.status == 'DELETED'} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: member-status(null, true, false)}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterStatus" name="status" th:value="${form.status}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>생성일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'CREATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>수정일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'UPDATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>최근접속일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'LAST_LOGIN_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>삭제일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'DELETED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>포인트</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'POINT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>소셜</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.provider == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="providerFilterDropdownList">
                <li>
                  <button class="dropdown-item provider-filter-li" data-role="update-filter"
                          data-target-element="filterProvider"
                          data-value="" th:classappend="${form.provider == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="provider: ${memberProviderList}">
                  <button class="dropdown-item provider-filter-li" data-role="update-filter"
                          data-target-element="filterProvider"
                          th:classappend="${form.provider != null and form.provider == provider.name} ? 'active'"
                          th:data-value="${provider.name}"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general(${provider.label})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterProvider" name="provider" th:value="${form.provider}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>성별</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.gender == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="genderFilterDropdownList">
                <li>
                  <button class="dropdown-item gender-filter-li" data-role="update-filter"
                          data-target-element="filterGender"
                          th:classappend="${form.gender == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="gender: ${memberGenderList}">
                  <button class="dropdown-item gender-filter-li" data-role="update-filter"
                          data-target-element="filterGender"
                          th:classappend="${form.gender != null and form.gender == gender.name} ? 'active'"
                          th:data-value="${gender.name}"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general(${gender.label})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterGender" name="gender" th:value="${form.gender}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>생년월일</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'BIRTH_DATE', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">도로명주소</th>
        <th scope="col">상세주소</th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="jobSeeker : ${page}">
        <td class="text-end" data-field="id" th:text="${jobSeeker.id}"></td>
        <td data-field="username" th:text="${jobSeeker.username}"></td>
        <td data-field="name" th:text="${jobSeeker.name}"></td>
        <td data-field="phone">[[${jobSeeker.formattedPhone}]]</td>
        <td data-field="phoneVerified">
          <span class="text-success" th:if="${jobSeeker.phoneVerified}"><th:block
            th:replace="~{admin/fragments/svg :: verified('phone-verified-icon')}"></th:block></span>
          <span class="text-danger" th:unless="${jobSeeker.phoneVerified}" title="휴대전화 번호가 인증되지 않았습니다."><th:block
            th:replace="~{admin/fragments/svg :: not-verified('phone-verified-icon')}"></th:block></span>
        </td>
        <td data-field="email" th:text="${jobSeeker.email}"></td>
        <td class="text-center" data-field="status">
          <th:block
            th:replace="~{admin/fragments/badge :: member-status(${jobSeeker.status}, ${jobSeeker.deletedAt ne null}, false)}"></th:block>
          <span class="d-none" data-field="suspendedAt"
                th:text="${#temporals.format(jobSeeker.suspendedAt, 'yyyy.MM.dd. HH:mm:ss')}"></span>
          <span class="d-none" data-field="suspendedReason">[[${jobSeeker.suspendedReason}]]</span>
        </td>
        <td data-field="createdAt" th:text="${#temporals.format(jobSeeker.createdAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td data-field="updatedAt" th:text="${#temporals.format(jobSeeker.updatedAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td data-field="lastLoginAt" th:text="${#temporals.format(jobSeeker.lastLoginAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td data-field="deletedAt" th:text="${#temporals.format(jobSeeker.deletedAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td class="text-end" data-field="point" th:text="${jobSeeker.point}"></td>
        <td data-field="socialLogins">
          <th:block th:each="socialLoginDto: ${jobSeeker.socialLoginDtoList}">
            <a data-bs-html="true" data-bs-toggle="tooltip" href="#"
               th:data-bs-title="${'연결 일시: ' + #temporals.format(socialLoginDto.linkedAt, 'yyyy.MM.dd. HH:mm:ss')}">
              <img
                class="provider-icon"
                th:src="@{'/images/admin/member/provider_'+${#strings.toLowerCase(socialLoginDto.provider.name())}+'.svg'}"/>
            </a>
          </th:block>
        </td>
        <td data-field="gender">
          <span th:if="${jobSeeker.gender.name() == 'MALE'}">남성</span>
          <span th:if="${jobSeeker.gender.name() == 'FEMALE'}">여성</span>
        </td>
        <td data-field="birthDate" th:text="${#temporals.format(jobSeeker.birthDate, 'yyyy.MM.dd.')}"></td>
        <td data-field="streetAddress" th:text="${jobSeeker.streetAddress}"></td>
        <td data-field="detailAddress" th:text="${jobSeeker.detailAddress}"></td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
            <li>
              <button class="dropdown-item date-range-criteria-li" data-bs-target="#suspendMemberModal"
                      data-bs-toggle="modal"
                      data-role="suspendMember"
                      th:text="${'계정 정지'+ ((jobSeeker.status.name() eq 'SUSPENDED') ? ' 사유 변경': '')}"
                      type="button"></button>
            </li>
            <li th:if="${jobSeeker.status.name() eq 'SUSPENDED'}">
              <button class="dropdown-item date-range-criteria-li" data-bs-target="#unsuspendMemberModal"
                      data-bs-toggle="modal"
                      data-role="unsuspendMember" type="button">계정 정지 해제
              </button>
            </li>
            <li th:if="${jobSeeker.phoneVerified}">
              <button class="dropdown-item date-range-criteria-li" data-bs-target="#removePhoneVerificationModal"
                      data-bs-toggle="modal"
                      data-role="removePhoneVerification" type="button">휴대전화 인증 삭제
              </button>
            </li>
            <li th:unless="${jobSeeker.phoneVerified}">
              <button class="dropdown-item date-range-criteria-li" data-bs-target="#addPhoneWithVerificationModal"
                      data-bs-toggle="modal"
                      data-role="addPhoneWithVerification" type="button">휴대전화 인증 추가
              </button>
            </li>
            <li>
              <button class="dropdown-item date-range-criteria-li" data-bs-target="#addBusinessRegistrationModal"
                      data-bs-toggle="modal"
                      data-role="addPhoneWithVerification" type="button">사업자등록번호 인증 추가
              </button>
            </li>
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
