<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block layout:fragment="css">
    <link rel="stylesheet" th:href="@{/css/admin/member/job-seeker.css}">
  </th:block>
</head>
<div layout:fragment="content">

  <div class="container admin-container">
    <form method="get" th:action="@{/admin/member/job-seeker}"
          th:with="form=${pagingHandler.form}">
      <div class="d-flex justify-content-end input-group input-group-sm">
        <button class="btn btn-light form-btn-left" type="button" id="currentPageSize">30개씩</button>
        <button class="btn btn-light form-btn-right dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
        <ul class="dropdown-menu dropdown-menu-end" id="pageSizeDropdownList">
          <li><button type="button" class="dropdown-item page-size-li" data-value="10">10개씩</button></li>
          <li><button type="button" class="dropdown-item page-size-li" data-value="30">30개씩</button></li>
          <li><button type="button" class="dropdown-item page-size-li" data-value="50">50개씩</button></li>
        </ul>
        <input type="hidden" id="pageSize" name="pageSize" th:value="${pageSize}"/>
        <button type="submit" class="btn btn-dark">검색</button>
      </div>
      <div class="row mb-3">
        <div class="col-12 col-md-6">
          <label class="search-form-label" for="keywords">검색 키워드</label>
          <div class="input-group input-group-sm">
            <button class="btn btn-light form-btn-left" type="button" id="currentKeywordType">전체</button>
            <button class="btn btn-light form-btn-right dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
            <ul class="dropdown-menu" id="keywordTypeDropdownList">
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="">전체</button></li>
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="USERNAME">아이디</button></li>
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="NAME">이름</button></li>
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="PHONE">전화번호</button></li>
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="EMAIL">이메일</button></li>
              <li><button type="button" class="dropdown-item keyword-type-li" data-value="ADDRESS">주소</button></li>
            </ul>
            <input type="hidden" id="keywordType" name="keywordType" th:value="${form.keywordType}"/>
            <input type="text" id="keywords" name="keywords" class="form-control" th:value="${form.keywords}"/>
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label class="search-form-label">날짜 범위</label>
          <div class="input-group input-group-sm">
            <button class="btn btn-light form-btn-left" type="button" id="currentDateRangeCriteria">선택</button>
            <button class="btn btn-light form-btn-right dropdown-toggle dropdown-toggle-split" type="button" data-bs-toggle="dropdown" aria-expanded="false"></button>
            <ul class="dropdown-menu" id="dateRangeCriteriaDropdownList">
              <li><button type="button" class="dropdown-item date-range-criteria-li" data-value="">선택</button></li>
              <li><button type="button" class="dropdown-item date-range-criteria-li" data-value="CREATED_AT">생성일시</button></li>
              <li><button type="button" class="dropdown-item date-range-criteria-li" data-value="UPDATED_AT">수정일시</button></li>
              <li><button type="button" class="dropdown-item date-range-criteria-li" data-value="LAST_LOGIN_AT">최근접속일시</button></li>
              <li><button type="button" class="dropdown-item date-range-criteria-li" data-value="BIRTH_DATE">생년월일</button></li>
            </ul>
            <input type="datetime-local" class="form-control" name="startDateTime" id="startDateTime" th:value="${form.startDateTime}"/>
            <input type="date" class="form-control" name="startDate" id="startDate" th:value="${form.startDate}">
            <span class="input-group-text">~</span>
            <input type="datetime-local" class="form-control form-control-end" name="endDateTime" id="endDateTime" th:value="${form.endDateTime}">
            <input type="date" class="form-control form-control-end" name="endDate" id="endDate" th:value="${form.endDate}">
            <input type="hidden" id="dateRangeCriteria" name="dateRangeCriteria" th:value="${form.dateRangeCriteria}"/>
          </div>
          <div class="float-end mt-2" id="dateRangeCriteriaAutofillWrapper">
            <div class="btn-group btn-group-xs" role="group" id="dateRangeCriteriaAutofill">
              <span class="btn btn-secondary">빠른 설정</span>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="1h">1시간</button>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="6h">6시간</button>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="12h">12시간</button>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="1d">1일</button>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="7d">1주</button>
              <button type="button" class="btn btn-outline-secondary date-range-criteria-autofill" data-value="1M">1개월</button>
            </div>
          </div>
        </div>
      </div>
      <div class="result-table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">아이디</th>
              <th scope="col">이름</th>
              <th scope="col" colspan="2">전화번호</th>
              <th scope="col">이메일</th>
              <th scope="col">
                <div class="d-flex gap-3 justify-content-between">
                  <span>상태</span>
                  <div class="dropdown d-flex justify-content-center align-items-center">
                    <button type="button" class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown">
                      <th:block th:replace="~{fragments/svg :: filter('filter-icon')}"></th:block>
                    </button>
                    <ul class="dropdown-menu filter-menu" id="statusFilterDropdownList">
                      <li><button type="button" class="dropdown-item status-filter-li" data-value="">전체</button></li>
                      <li><button type="button" class="dropdown-item status-filter-li" data-value="ACTIVE">활동</button></li>
                      <li><button type="button" class="dropdown-item status-filter-li" data-value="DORMANT">휴면</button></li>
                      <li><button type="button" class="dropdown-item status-filter-li" data-value="SUSPEND">정지</button></li>
                      <li><button type="button" class="dropdown-item status-filter-li" data-value="DELETED">탈퇴</button></li>
                    </ul>
                  </div>
                </div>
              </th>
              <th scope="col">
                <span class="d-flex gap-3 justify-content-between">
                  <span>생성일시</span>
                  <button type="button" class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown">
                    <th:block th:replace="~{fragments/svg :: sort('sort-icon')}"></th:block>
                  </button>
                </span>
              </th>
              <th scope="col">
                <span class="d-flex gap-3 justify-content-between">
                  <span>수정일시</span>
                  <button type="button" class="btn btn-reset btn-th" data-bs-toggle="dropdown">
                    <th:block th:replace="~{fragments/svg :: sort('sort-icon')}"></th:block>
                  </button>
                </span>
              </th>
              <th scope="col">
                <span class="d-flex gap-3 justify-content-between">
                  <span>최근접속일시</span>
                  <button type="button" class="btn btn-reset btn-th" data-bs-toggle="dropdown">
                    <th:block th:replace="~{fragments/svg :: sort('sort-icon')}"></th:block>
                  </button>
                </span>
              </th>
              <th scope="col">
                <span class="d-flex gap-3 justify-content-between">
                  <span>삭제일시</span>
                  <button type="button" class="btn btn-reset" data-bs-toggle="dropdown">
                    <th:block th:replace="~{fragments/svg :: sort('sort-icon')}"></th:block>
                  </button>
                </span>
              </th>
              <th scope="col">포인트</th>
              <th scope="col">소셜</th>
              <th scope="col">성별</th>
              <th scope="col">생일</th>
              <th scope="col">도로명주소</th>
              <th scope="col">상세주소</th>
              <th scope="col" class="text-center bg-body-secondary">관리</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="jobSeeker : ${page}">
              <td th:text="${jobSeeker.id}"></td>
              <td th:text="${jobSeeker.username}"></td>
              <td th:text="${jobSeeker.name}"></td>
              <td>[[${jobSeeker.formattedPhone}]]</td>
              <td>
                <span th:if="${jobSeeker.phoneVerified}">✅</span>
                <span th:unless="${jobSeeker.phoneVerified}" title="휴대전화 번호가 인증되지 않았습니다.">⚠️</span>
              </td>
              <td th:text="${jobSeeker.email}"></td>
              <td th:text="${jobSeeker.statusString}"></td>
              <td th:text="${#temporals.format(jobSeeker.createdAt, 'yyyy.MM.dd. HH:mm')}"></td>
              <td th:text="${#temporals.format(jobSeeker.updatedAt, 'yyyy.MM.dd. HH:mm')}"></td>
              <td th:text="${#temporals.format(jobSeeker.lastLoginAt, 'yyyy.MM.dd. HH:mm')}"></td>
              <td th:text="${#temporals.format(jobSeeker.deletedAt, 'yyyy.MM.dd. HH:mm')}"></td>
              <td class="text-end" th:text="${jobSeeker.point}"></td>
              <td>
                <th:block th:each="socialLoginDto: ${jobSeeker.socialLoginDtoList}">
                  <img th:src="@{'/images/admin/member/provider_'+${#strings.toLowerCase(socialLoginDto.provider.name())}+'.svg'}"
                       class="provider-icon"
                       th:alt-title="${socialLoginDto.provider.name() + ' / 연결 일시: ' + #temporals.format(socialLoginDto.linkedAt, 'yyyy.MM.dd. HH:mm:ss')}"/>
                </th:block>
              </td>
              <td>
                <span th:if="${jobSeeker.gender.name() == 'MALE'}">남성</span>
                <span th:if="${jobSeeker.gender.name() == 'FEMALE'}">여성</span>
              </td>
              <td th:text="${#temporals.format(jobSeeker.birthDate, 'yyyy.MM.dd.')}"></td>
              <td th:text="${jobSeeker.streetAddress}"></td>
              <td th:text="${jobSeeker.detailAddress}"></td>
              <td class="center bg-body-secondary">
                <button type="button" class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown">
                  <th:block th:replace="~{fragments/svg :: moderation('moderation-icon')}"></th:block>
                </button>
                <ul class="dropdown-menu moderation-menu">
                  <li th:if="${jobSeeker.status.name() ne 'SUSPENDED'}"><button type="button" class="dropdown-item date-range-criteria-li" data-role="suspendMember">계정 정지</button></li>
                  <li th:if="${jobSeeker.status.name() eq 'SUSPENDED'}"><button type="button" class="dropdown-item date-range-criteria-li" data-role="unsuspendMember">계정 정지 해제</button></li>
                  <li th:if="${jobSeeker.phoneVerified}"><button type="button" class="dropdown-item date-range-criteria-li" data-value="removePhoneVerification">휴대전화 인증 삭제</button></li>
                  <li th:unless="${jobSeeker.phoneVerified}"><button type="button" class="dropdown-item date-range-criteria-li" data-value="removePhoneVerification">휴대전화 인증 추가</button></li>
                </ul>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div>
        <nav>
          <ul class="admin-pagination pagination pagination-sm justify-content-center mt-2">
            <li class="page-item" th:classappend="${pagingHandler.prevBtnActive eq false ? 'disabled' : '' }">
              <button class="page-link" name="pageIdx" th:value="${pagingHandler.pageIdx - 1}" type="submit">←</button>
            </li>
            <li class="page-item"
                th:classappend="${i == pagingHandler.pageIdx} ? 'active'"
                th:each="i : ${#numbers.sequence(pagingHandler.startPageIdx, pagingHandler.endPageIdx)}">
              <button class="page-link" name="pageIdx" th:value="${i}" type="submit">[[${i}]]</button>
            </li>
            <li class="page-item" th:classappend="${pagingHandler.nextBtnActive eq false ? 'disabled' : '' }">
              <button class="page-link" name="pageIdx" th:value="${pagingHandler.pageIdx + 1}" type="submit">→</button>
            </li>
          </ul>
        </nav>
      </div>

    </form>
  </div>
  <script th:src="@{/js/admin/member/job-seeker.js}"></script>
</div>
