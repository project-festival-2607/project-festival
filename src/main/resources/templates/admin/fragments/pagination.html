<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="pagination(pagingHandler, pageSize, pageSizeOptions)">
  <nav class="d-flex mt-2">
    <div class="flex-grow-1">
      <ul class="admin-pagination pagination pagination-sm justify-content-center mb-0">
        <li class="page-item" th:classappend="${pagingHandler.prevBtnActive eq false ? 'disabled' : '' }">
          <button class="page-link" name="pageIdx" th:value="${pagingHandler.pageIdx - 1}" type="submit">←</button>
        </li>
        <li class="page-item"
            th:classappend="${i == pagingHandler.pageIdx} ? 'active'"
            th:each="i : ${#numbers.sequence(pagingHandler.startPageIdx, pagingHandler.endPageIdx)}">
          <button class="page-link" name="pageIdx" th:value="${i}" type="submit">[[${i}]]</button>
        </li>
        <li class="page-item" th:classappend="${pagingHandler.nextBtnActive eq false ? 'disabled' : '' }">
          <button class="page-link" name="pageIdx" th:value="${pagingHandler.pageIdx + 1}" type="submit">→</button>
        </li>
      </ul>
    </div>
    <div class="page-size-selector">
      <div class="d-flex justify-content-end input-group input-group-sm">
        <button class="btn btn-light dropdown-btn-left" id="currentPageSize" type="button"></button>
        <button aria-expanded="false"
                class="btn btn-light dropdown-btn-right dropdown-toggle dropdown-toggle-split border-radius-end"
                data-bs-toggle="dropdown" type="button"></button>
        <ul class="dropdown-menu dropdown-menu-end" id="pageSizeDropdownList">
          <li th:each="value: ${pageSizeOptions}">
            <button class="dropdown-item page-size-li" th:text="${value + '개씩'}" th:value="${value}"
                    type="submit"></button>
          </li>
        </ul>
        <input id="pageSize" name="pageSize" th:value="${pageSize}" type="hidden"/>
      </div>
    </div>
    <input id="pageIdx" name="pageIdx" th:value="${pagingHandler.pageIdx}" type="hidden"/>
  </nav>
</th:block>
