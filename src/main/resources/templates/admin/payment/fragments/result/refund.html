<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="refund-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 270px;"> <!-- transactionKey -->
        <col style="width: 80px;">  <!-- 상태 -->
        <col style="width: 100px;"> <!-- 환불양 -->
        <col style="width: 120px;"> <!-- 실제환불양 -->
        <col style="width: 150px;"> <!-- 환불일시 -->
        <col style="width: 150px;"> <!-- 취소일시 -->
        <col style="width: 200px;"> <!-- 사용자 [이름 (아이디)]-->
        <col style="width: 65px;">  <!-- 기록 # -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">transactionKey</th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>상태</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.status == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="statusFilterDropdownList">
                <li>
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.status == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="status: ${refundStatusList}">
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.status != null and form.status == status.name} ? 'active'"
                          th:data-value="${status.name}"
                          type="button">
                    <th:block
                      th:replace="~{admin/fragments/badge :: general-with-badgeClass(${status.label}, ${status.badgeClass})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterStatus" name="status" th:value="${form.status}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>환불양</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'REFUND_AMOUNT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>실제환불양</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'REFUND_REAL', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          scope="col"
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>취소일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'CANCELED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">사용자</th>
        <th scope="col">기록 #</th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="refund : ${page}">
        <td data-field="id" th:text="${refund.id}"></td>
        <td data-field="transactionKey" th:text="${refund.transactionKey}"></td>
        <td class="text-center">
          <th:block
            th:replace="~{admin/fragments/badge :: general-with-badgeClass(${refund.status.label}, ${refund.status.badgeClass})}"></th:block>
          <span class="d-none" data-field="status"
                th:text="${refund.status}"></span>
        </td>
        <td data-field="refundAmount" th:text="${refund.refundAmount}"></td>
        <td data-field="refundReal" th:text="${refund.refundReal}"></td>
        <td data-field="recordedAt" th:text="${#temporals.format(refund.recordedAt, 'yyyy.MM.dd. HH:mm:ss')}"></td>
        <td data-field="canceledAt" th:text="${#temporals.format(refund.canceledAt, 'yyyy.MM.dd. HH:mm:ss')}"></td>
        <td>
          <span class="d-none" data-field="memberId" th:text="${refund.memberId}"></span>
          <th:block th:if="${refund.memberId ne null}">
            <span data-field="memberName" th:text="${refund.memberName}"></span>
            <span data-field="memberUsername" th:text="'('+${refund.memberUsername}+')'"></span>
          </th:block>
        </td>
        <td th:field="recordId" th:text="${refund.recordId}"></td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
