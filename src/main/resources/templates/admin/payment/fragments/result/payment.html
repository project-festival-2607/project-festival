<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="payment-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 200px;"> <!-- 사용자 [이름 (아이디)]-->
        <col style="width: 150px;"> <!-- 상품 -->
        <col style="width: 170px;">  <!-- 상태 -->
        <col style="width: 110px;">  <!-- 결제수단 -->
        <col style="width: 200px;"> <!-- 결제요청시각 -->
        <col style="width: 200px;"> <!-- 결제승인시각 -->
        <col style="width: 200px;"> <!-- 생성일시 -->
        <col style="width: 200px;"> <!-- 수정일시 -->
        <col style="width: 240px;"> <!-- paymentKey -->
        <col style="width: 240px;"> <!-- orderId -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">사용자</th>
        <th scope="col">상품</th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>상태</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.paymentStatus == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="statusFilterDropdownList">
                <li>
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.paymentStatus == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="paymentStatus: ${paymentStatusList}">
                  <button class="dropdown-item status-filter-li" data-role="update-filter"
                          data-target-element="filterStatus"
                          th:classappend="${form.paymentStatus != null and form.paymentStatus == paymentStatus.name} ? 'active'"
                          th:data-value="${paymentStatus.name}"
                          type="button">
                    <th:block
                      th:replace="~{admin/fragments/badge :: general-with-badgeClass(${paymentStatus.label}, ${paymentStatus.badgeClass})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterStatus" name="paymentStatus" th:value="${form.paymentStatus}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>결제수단</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.paymentMethod == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="methodFilterDropdownList">
                <li>
                  <button class="dropdown-item method-filter-li" data-role="update-filter"
                          data-target-element="filterMethod"
                          th:classappend="${form.paymentMethod == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="paymentMethod: ${paymentMethodList}">
                  <button class="dropdown-item method-filter-li" data-role="update-filter"
                          data-target-element="filterMethod"
                          th:classappend="${form.paymentMethod != null and form.paymentMethod == paymentMethod.name} ? 'active'"
                          th:data-value="${paymentMethod.name}"
                          type="button">
                    <th:block
                      th:replace="~{admin/fragments/badge :: general(${paymentMethod.label})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterMethod" name="paymentMethod" th:value="${form.paymentMethod}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
        <span class="d-flex gap-3 justify-content-between">
            <span>결제요청시각</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
        'REQUESTED_AT', ${form.sortCriteria}, ${form.ascending}
        )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>결제승인시각</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'APPROVED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>생성일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'CREATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>수정일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'UPDATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">payment_key</th>
        <th scope="col">order_id</th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="payment : ${page}">
        <td data-field="paymentId" th:text="${payment.paymentId}"></td>
        <td>
          <span class="d-none" data-field="memberId" th:text="${payment.memberId}"></span>
          <div class="d-flex align-items-center justify-content-between gap-2">
            <span class="text-ellipsis-with-suffix">
              <span class="ellipsis-main">
                <span data-field="memberName" th:text="${payment.memberName}"></span>
                <span data-field="memberUsername" th:text="'('+${payment.memberUsername}+')'"></span>
              </span>
            </span>
            <span class="flex-shrink-0">
              <span th:replace="~{admin/fragments/tooltip :: unique-id(${payment.memberId})}"></span>
            </span>
          </div>
        </td>
        <td>
          <div class="d-flex align-items-center justify-content-between gap-2">
            <span class="d-none" data-field="productId" th:text="${payment.productId}"></span>
            <span class="min-width-0">
              <a class="fw-medium text-ellipsis-with-suffix gap-1" target="_blank"
                 th:href="@{/admin/payment/product(keywordType='PRODUCT_ID',keywords=${payment.productId})}">
                <span class="ellipsis-main" data-field="productName" th:text="${payment.productName}"></span>
                <span class="ellipsis-suffix">
                  <th:block th:replace="~{admin/fragments/svg :: new-window('new-window-icon')}"></th:block>
                </span>
              </a>
            </span>
            <span class="d-none" data-field="productId" th:text="${payment.productId}"></span>
            <span class="flex-shrink-0">
              <span th:replace="~{admin/fragments/tooltip :: unique-id(${payment.productId})}"></span>
            </span>
          </div>
        </td>
        <td class="text-center">
          <th:block
            th:replace="~{admin/fragments/badge :: general-with-badgeClass(${payment.paymentStatus.label}, ${payment.paymentStatus.badgeClass})}"></th:block>
          <span class="d-none" data-field="paymentStatus"
                th:text="${payment.paymentStatus}"></span>
        </td>
        <td class="text-center">
          <th:block
            th:replace="~{admin/fragments/badge :: general(${payment.paymentMethod.label})}"></th:block>
          <span class="d-none" data-field="paymentMethod"
                th:text="${payment.paymentMethod}"></span>
        </td>
        <td data-field="requestedAt" th:text="${#temporals.format(payment.requestedAt, 'yyyy.MM.dd. HH:mm:ss')}"></td>
        <td data-field="approvedAt" th:text="${#temporals.format(payment.approvedAt, 'yyyy.MM.dd. HH:mm:ss')}"></td>
        <td data-field="createdAt" th:text="${#temporals.format(payment.createdAt, 'yyyy.MM.dd. HH:mm:ss.SSS')}"></td>
        <td data-field="updatedAt" th:text="${#temporals.format(payment.updatedAt, 'yyyy.MM.dd. HH:mm:ss.SSS')}"></td>
        <td data-field="paymentKey" th:text="${payment.paymentKey}"></td>
        <td data-field="orderId" th:text="${payment.orderId}"></td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
