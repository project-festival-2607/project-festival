<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="use-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 200px;"> <!-- 사용자 [이름 (아이디)]-->
        <col style="width: 340px">  <!-- 등록 공고 -->
        <col style="width: 100px;"> <!-- 사용량 -->
        <col style="width: 150px;"> <!-- 사용일시 -->
        <col style="width: 70px;">  <!-- 결제번호 -->
        <col style="width: 100px;">  <!-- 전체기록 UID -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">사용자</th>
        <th scope="col">등록 공고</th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>사용량</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'POINT_CHANGING', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>사용일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'USED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">결제번호</th>
        <th scope="col">전체기록 UID</th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="use : ${page}">
        <td data-field="pointHistoryId" th:text="${use.pointHistoryId}"></td>
        <td>
          <span class="d-none" data-field="memberId" th:text="${use.memberId}"></span>
          <div class="d-flex align-items-center justify-content-between gap-2">
            <span class="text-ellipsis-with-suffix">
              <span class="ellipsis-main">
                <span data-field="memberName" th:text="${use.memberName}"></span>
                <span data-field="memberUsername" th:text="'('+${use.memberUsername}+')'"></span>
              </span>
            </span>
            <span class="flex-shrink-0">
              <span th:replace="~{admin/fragments/small-button :: unique-id(${use.memberId})}"></span>
            </span>
          </div>
        </td>
        <td>
          <a class="fw-medium text-ellipsis-with-suffix gap-1" target="_blank"
             th:href="@{/recruitment/{id}(id=${use.recruitmentId})}">
            <span class="ellipsis-main" data-field="recruitmentTitle" th:text="${use.recruitmentTitle}"></span>
            <span class="ellipsis-suffix">
              <th:block th:replace="~{admin/fragments/svg :: new-window('new-window-icon')}"></th:block>
            </span>
          </a>
        </td>
        <td class="text-end" data-field="pointChanging" th:text="${use.pointChanging}"></td>
        <td data-field="usedAt" th:text="${#temporals.format(use.usedAt, 'yyyy.MM.dd. HH:mm:ss')}"></td>
        <td>
          <div class="d-flex justify-content-end align-items-center gap-2">
            <span data-field="paymentId" th:text="${use.paymentId}"></span>
            <th:block th:replace="~{admin/fragments/small-button :: new-tab(
            @{/admin/payment/charge(keywordCriteria='EXACT', keywordType='PAYMENT_ID', keywords=${use.paymentId})}
          )}"></th:block>
          </div>
        </td>
        <td>
          <div class="d-flex justify-content-end align-items-center gap-2">
            <span data-field="recordId" th:text="${use.recordId}"></span>
            <th:block th:replace="~{admin/fragments/small-button :: new-tab(
            @{/admin/payment/summary(recordId=${use.recordId})}
          )}"></th:block>
          </div>
        </td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  disabled type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
