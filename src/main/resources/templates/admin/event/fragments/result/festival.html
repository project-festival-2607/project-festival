<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="inquiry-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 340px">  <!-- 제목 -->
        <col style="width: 300px;"> <!-- 상세주소 -->
        <col style="width: 200px;"> <!-- 장소 -->
        <col style="width: 90px;">  <!-- 우편번호 -->
        <col style="width: 135px;"> <!-- 시작일 -->
        <col style="width: 135px;"> <!-- 종료일 -->
        <col style="width: 200px;"> <!-- 담당자 [이름 (아이디)]-->
        <col style="width: 95px;">  <!-- 공고 개수 -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">제목</th>
        <th scope="col">상세주소</th>
        <th scope="col">장소</th>
        <th scope="col">우편번호</th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>시작일</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'START_DATE', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>종료일</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'END_DATE', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th>담당자</th>
        <th>
          <span class="d-flex gap-3 justify-content-between">
            <span>공고 개수</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'RECRUITMENT_COUNT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
