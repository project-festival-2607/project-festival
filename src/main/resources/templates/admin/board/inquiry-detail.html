<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/admin-layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/admin/result-fragment.css}">
        <link rel="stylesheet" th:href="@{/css/admin/result-fragment-inquiry.css}">
        <link rel="stylesheet" th:href="@{/css/admin/common.css}">
        <link rel="stylesheet" th:href="@{/css/admin/search-form.css}">
    </th:block>
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <h1 class="mb-3">문의 답변</h1>

        <div class="mb-3">
            <input type="text" class="form-control" th:value="${inquiry.title}" readonly>
        </div>
        <div class="mb-3">
            <textarea class="form-control" rows="6" readonly th:text="${inquiry.content}"></textarea>
        </div>

        <div class="mb-3" th:if="${not #lists.isEmpty(inquiry.files)}">
            <label class="form-label">첨부파일</label>
            <ul class="list-group">
                <li class="list-group-item" th:each="file : ${inquiry.files}">
                    <a th:href="@{/inquiry/file/{uuid}/download(uuid=${file.uuid})}" th:text="${file.name}"></a>
                </li>
            </ul>
        </div>

        <form th:action="@{/inquiry/admin/answer/{ino}(ino=${inquiry.ino})}" method="post">
            <div class="mb-3">
                <label for="comment" class="form-label">답변</label>
                <!-- 한 번 등록된 답변은 수정 불가 -->
                <textarea class="form-control" name="comment" id="comment" rows="6"
                          th:text="${inquiry.comment}" th:readonly="${inquiry.comment != null}"
                          placeholder="답변 내용을 입력해주세요"></textarea>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a th:href="@{/admin/board/inquiry}" class="btn btn-outline-secondary">목록</a>
                <button type="submit" class="btn btn-primary" th:if="${inquiry.comment == null}">답변 등록</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
