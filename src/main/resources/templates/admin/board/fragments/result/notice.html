<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="notice-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 90px;">  <!-- 중요 표기 -->
        <col style="width: 340px"> <!-- 제목 -->
        <col style="width: 135px;"> <!-- 작성일시 -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>중요도</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.highlight == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="memberRoleFilterDropdownList">
                <li>
                  <button class="dropdown-item highlight-filter-li" data-role="update-filter"
                          data-target-element="filterHighlight"
                          th:classappend="${form.highlight == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li>
                  <button class="dropdown-item highlight-filter-li" data-role="update-filter"
                          data-target-element="filterHighlight"
                          th:classappend="${form.highlight != null and form.highlight == 'true'} ? 'active'"
                          th:data-value="${'true'}"
                          type="button">
                    <th:block
                      th:replace="~{admin/fragments/badge :: general-with-badgeClass(${'중요'}, ${'notice-highlight'})}"></th:block>
                  </button>
                </li>
                <li>
                  <button class="dropdown-item highlight-filter-li" data-role="update-filter"
                          data-target-element="filterHighlight"
                          th:classappend="${form.highlight != null and form.highlight == 'false'} ? 'active'"
                          th:data-value="${'false'}"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general(${'일반'})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterHighlight" name="highlight" th:value="${form.highlight}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">제목</th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>작성일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'CREATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="notice : ${page}">
        <td class="text-end" data-field="ino" th:text="${notice.bno}"></td>
        <td class="text-center" data-field="memberRole">
          <th:block th:if="${notice.highlight==true}">
            <th:block
              th:replace="~{admin/fragments/badge :: general-with-badgeClass('중요', 'notice-highlight')}"></th:block>
          </th:block>
        </td>
        <!--  태그 달아서 답변 작성 페이지로  -->
        <td>
          <a class="fw-medium" data-field="title"
             th:href="@{/notice/detail/{bno}(bno=${notice.bno})}"
             th:text="${notice.title}"></a>
        </td>
        <td data-field="createdAt" th:text="${#temporals.format(notice.createdAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
