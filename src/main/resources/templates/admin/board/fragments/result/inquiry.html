<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="inquiry-result">
  <div class="result-table-wrapper"
       id="tableWrapper"
       th:with="form=${pagingHandler.form}">
    <input id="sortCriteria" name="sortCriteria" th:value="${form.sortCriteria}" type="hidden"/>
    <input id="ascending" name="ascending" th:value="${form.ascending}" type="hidden"/>
    <table class="table">
      <colgroup>
        <col style="width: 65px;">  <!-- # -->
        <col style="width: 340px">  <!-- 제목 -->
        <col style="width: 200px;"> <!-- 작성자 [이름 (아이디)]-->
        <col style="width: 90px;">  <!-- 작성자 역할 -->
        <col style="width: 135px;"> <!-- 작성일시 -->
        <col style="width: 135px;"> <!-- 수정일시 -->
        <col style="width: 90px;">  <!-- 답변상태 -->
        <col style="width: 135px;"> <!-- 답변일시 -->
        <col style="width: 45px;">  <!-- 관리 -->
      </colgroup>
      <thead>
      <tr>
        <th scope="col">#</th>
        <th scope="col">제목</th>
        <th scope="col">작성자</th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>구분</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.replyStatus == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="memberRoleFilterDropdownList">
                <li>
                  <button class="dropdown-item member-role-filter-li" data-role="update-filter"
                          data-target-element="filterMemberRole"
                          th:classappend="${form.memberRole == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="memberRole: ${memberRoleList}">
                  <button class="dropdown-item member-role-filter-li" data-role="update-filter"
                          data-target-element="filterMemberRole"
                          th:classappend="${form.memberRole != null and form.memberRole == memberRole.name} ? 'active'"
                          th:data-value="${memberRole.name}"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general(${memberRole.label})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterMemberRole" name="memberRole" th:value="${form.memberRole}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>작성일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'CREATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>수정일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'UPDATED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th scope="col">
          <div class="d-flex gap-3 justify-content-between">
            <span>상태</span>
            <div class="dropdown d-flex justify-content-center align-items-center">
              <button class="btn btn-reset btn-th dropdown-toggle dropdown-no-caret" data-bs-toggle="dropdown"
                      type="button">
                <th:block th:replace="${form.replyStatus == null}
                                      ? ~{admin/fragments/svg :: filter-idle('filter-idle-icon')}
                                      : ~{admin/fragments/svg :: filter-active('filter-active-icon')}"></th:block>
              </button>
              <ul class="dropdown-menu filter-menu" id="replyStatusFilterDropdownList">
                <li>
                  <button class="dropdown-item reply-status-filter-li" data-role="update-filter"
                          data-target-element="filterReplyStatus"
                          th:classappend="${form.replyStatus == null} ? 'active'"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: general('전체')}"></th:block>
                  </button>
                </li>
                <li th:each="replyStatus: ${inquiryReplyStatusList}">
                  <button class="dropdown-item reply-status-filter-li" data-role="update-filter"
                          data-target-element="filterReplyStatus"
                          th:classappend="${form.replyStatus != null and form.replyStatus == replyStatus.name} ? 'active'"
                          th:data-value="${replyStatus.name}"
                          type="button">
                    <th:block th:replace="~{admin/fragments/badge :: inquiry-reply-status(${replyStatus})}"></th:block>
                  </button>
                </li>
              </ul>
              <input id="filterReplyStatus" name="replyStatus" th:value="${form.replyStatus}" type="hidden">
            </div>
          </div>
        </th>
        <th scope="col">
          <span class="d-flex gap-3 justify-content-between">
            <span>답변일시</span>
            <th:block th:replace="~{admin/fragments/sort-button :: sort-button(
            'REPLIED_AT', ${form.sortCriteria}, ${form.ascending}
            )}"></th:block>
          </span>
        </th>
        <th class="text-center bg-body-secondary" scope="col">관리</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="inquiry : ${page}">
        <td class="text-end" data-field="ino" th:text="${inquiry.ino}"></td>
        <!--  태그 달아서 답변 작성 페이지로  -->
        <td>
          <a class="fw-medium" data-field="title"
             th:href="@{/admin/board/inquiry/{ino}(ino=${inquiry.ino})}" th:text="${inquiry.title}"></a>
        </td>
        <td>
          <span data-field="memberName" th:text="${inquiry.memberName}"></span>
          <span data-field="memberUsername" th:text="'('+${inquiry.memberUsername}+')'"></span>
        </td>
        <td class="text-center" data-field="memberRole">
          <th:block
            th:replace="~{admin/fragments/badge :: general(${inquiry.memberRole.label})}"></th:block>
        </td>
        <td data-field="createdAt" th:text="${#temporals.format(inquiry.createdAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td data-field="updatedAt" th:text="${#temporals.format(inquiry.updatedAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td data-field="replyStatus">
          <th:block
            th:replace="~{admin/fragments/badge :: inquiry-reply-status(${inquiry.replyStatus})}"></th:block>
        </td>
        <td data-field="repliedAt" th:text="${#temporals.format(inquiry.repliedAt, 'yyyy.MM.dd. HH:mm')}"></td>
        <td class="center bg-body-secondary">
          <button class="btn btn-reset dropdown-toggle dropdown-no-caret moderation-btn" data-bs-toggle="dropdown"
                  type="button">
            <th:block th:replace="~{admin/fragments/svg :: moderation('moderation-icon')}"></th:block>
          </button>
          <ul class="dropdown-menu moderation-menu">
          </ul>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
  <div>
    <th:block th:replace="~{admin/fragments/pagination :: pagination(
      ${pagingHandler},
      ${pageSize},
      ${pageSizeOptions}
    )}"></th:block>
  </div>
</th:block>
