<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>이력서 삭제</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 400px;">
    <h1 class="mb-4 text-center mt-5">비밀번호 확인</h1>

    <p class="text-center text-muted mb-4">
        이력서를 삭제하려면 비밀번호를 입력해주세요.
    </p>

    <!-- 비밀번호 불일치 메시지 -->
    <div th:if="${FailureMsg != null}" class="alert alert-danger" role="alert">
        [[${FailureMsg}]]
    </div>

    <form th:action="@{/resume/delete-password}" method="post">
        <div class="mb-3">
            <!-- 삭제할 이력서 ID -->
            <input type="hidden" name="resumeId" th:value="${resumeId}">
            <!-- 아이디 -->
            <div class="mb-3">
                <label for="username" class="form-label">
                    아이디
                </label>
                <input type="text" class="form-control" id="username" th:value="${username}" disabled>
            </div>
            <!-- 비밀번호 -->
            <div class="mb-3">
                <label for="password" class="form-label">
                    비밀번호
                </label>
                <input type="password" class="form-control" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
            </div>
        </div>

        <!-- 버튼 -->
        <button type="submit" class="btn btn-primary w-100" onclick="return confirm('정말 이력서를 삭제하시겠습니까?');">
            이력서 삭제
        </button>
    </form>
    <!-- 취소 -->
    <div class="mt-2">
        <a th:href="@{/resume/manage}" class="btn btn-secondary w-100">
            취소
        </a>
    </div>
</div>
</body>
</html>
