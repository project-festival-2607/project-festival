<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<div layout:fragment="content">
    <link rel="stylesheet" th:href="@{/css/resume/register.css}">
    <div class="container">
        <!--                모든 inner는 class="container" 로 맞춤        -->
        <!--        이 안에서 작업        -->
        <h1>이력서 수정</h1>

        <form th:action="@{/resume/modify}" method="post" enctype="multipart/form-data">

        <!-- 수정할 이력서 ID -->
        <input type="hidden" name="resumeId" th:value="${resume.id}">

            <section class="resume-section">
                <h2>기본 정보</h2>

                <div class="form-group">
                    <label> 자기소개 </label>

                    <textarea id="introduction" name="introduction" rows="8" th:text="${resume.introduction}"></textarea>
                </div>
            </section>

            <!-- 프로필 사진 -->
            <section class="resume-section">
                <h2>프로필 사진</h2>

                <div class="form-group">
                    <label> 프로필 사진 </label>

                    <input type="file" id="profileImage" name="profileImage" accept="image/*">
                </div>
            </section>

            <!-- 경력 -->
            <section class="resume-section">
                <h2> 경력 사항 </h2>

                <div id="career-container">
                    <div th:each="career, stat : ${resume.careers}" class="career-item">

                        <!-- 경력 ID -->
                        <input type="hidden" th:name="'careers[' + ${stat.index} + '].id'" th:value="${career.id}">

                        <div class="form-group">
                            <label> 회사명 </label>

                            <input type="text" th:name="'careers[' + ${stat.index} + '].careerName'" th:value="${career.careerName}">
                        </div>

                        <div class="form-group">
                            <label> 입사일 </label>

                            <input type="date" th:name="'careers[' + ${stat.index} + '].startDate'" th:value="${career.startDate}">
                        </div>

                        <div class="form-group">
                            <label> 퇴사일 </label>

                            <input type="date" th:name="'careers[' + ${stat.index} + '].endDate'" th:value="${career.endDate}">
                        </div>

                        <div class="form-group">
                            <label> 담당 업무 </label>

                            <textarea th:name="'careers[' + ${stat.index} + '].duties'" rows="5" th:text="${career.duties}"></textarea></textarea>
                        </div>

                        <button type="button" class="remove-career">
                            경력 삭제
                        </button>
                    </div>
                </div>
                <button type="button" id="add-career">
                    경력 추가
                </button>
            </section>

            <!-- 포트폴리오 -->
            <section class="resume-section">
                <h2>포트폴리오</h2>

                <div id="portfolio-container">
                    <div th:each="portfolio, stat : ${resume.portfolios}" class="portfolio-item">

                        <!-- 포트폴리오 ID -->
                        <input type="hidden" th:name="'portfolios[' + ${stat.index} + '].id'" th:value="${portfolio.id}">

                        <!-- 포트폴리오 제목 -->
                        <div class="form-group">
                            <label> 포트폴리오 제목 </label>

                            <input type="text" th:name="'portfolios[' + ${stat.index} + '].title'" th:value="${portfolio.title}">
                        </div>

                        <!-- 포트폴리오 타입 -->
                        <div class="form-group">
                            <label> 포트폴리오 유형 </label>

                            <select class="portfolio-type" th:name="'portfolios[' + ${stat.index} + '].type'">
                                <option value="">선택하세요</option>

                                <option value="URL" th:selected="${portfolio.type.name() == 'URL'}">
                                    URL
                                </option>

                                <option value="FILE" th:selected="${portfolio.type.name() == 'FILE'}">
                                    파일
                                </option>
                            </select>
                        </div>

                        <!-- URL -->
                        <div class="form-group portfolio-url"
                             th:style="${portfolio.type.name() == 'URL'} ? 'display:block' : 'display:none'">
                            <label> 포트폴리오 URL </label>

                            <input type="text" th:name="'portfolios[' + ${stat.index} + '].url'" th:value="${portfolio.url}" >
                        </div>

                        <!-- 첨부파일 -->
                        <div class="form-group portfolio-file"
                             th:style="${portfolio.type.name() == 'FILE'} ? 'display:block' : 'display:none'">
                            <label> 첨부파일 </label>

                            <div th:if="${portfolio.resumeFile != null}">
                                <span th:text="${portfolio.resumeFile.originalName}"></span>
                            </div>

                            <input type="file" name="portfolioFile">
                        </div>

                        <button type="button" class="remove-portfolio">
                            포트폴리오 삭제
                        </button>
                    </div>
                </div>

                <button type="button" id="add-portfolio">
                    포트폴리오 추가
                </button>
            </section>

            <!-- 버튼 -->
            <div class="resume-buttons">
                <button type="submit" class="register-btn"> 이력서 수정 </button>
                <a th:href="@{/resume/manage}" class="cancel-btn"> 취소 </a>
            </div>
        </form>

        <script th:src="@{/js/resume/modify.js}"></script>
    </div>
</div>
