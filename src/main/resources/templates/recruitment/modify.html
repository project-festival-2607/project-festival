<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/libs/toastui-editor-3.2.2/css/toastui-editor.min.css}" />
        <link rel="stylesheet" th:href="@{/css/recruit/register.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="container recruit-register">
        <h1>구인공고 수정</h1>

        <div th:if="${hasError}">
            <p class="recruit-form-error">입력값을 다시 확인해주세요.</p>
            <ul class="recruit-form-error">
                <li th:each="msg : ${errorMessages}" th:text="${msg}"></li>
            </ul>
        </div>

        <form th:action="@{/recruitment/modify/{id}(id=${recruitmentId})}" method="post" id="modifyForm">

            <!-- 1. 행사 선택 (등록 폼과 동일한 필드지만 서비스에서 변경을 반영하지 않음) -->
            <div class="recruit-field">
                <label for="festivalContentId">모집할 행사</label>
                <select name="festivalContentId" id="festivalContentId" class="form-select" required disabled>
                    <option value="">행사를 선택하세요</option>
                    <option th:each="fes : ${festivals}"
                            th:value="${fes.contentId}"
                            th:text="${fes.title}"
                            th:selected="${fes.contentId == festivalContentId}"></option>
                </select>
            </div>

            <!-- 2. 지역 선택 (시도 -> 시군구 연동) -->
            <div class="recruit-field recruit-field-row recruit-field-row-narrow">
                <div>
                    <label for="regionSidoCode">지역(시/도)</label>
                    <select name="regionSidoCode" id="regionSidoCode" class="form-select" required>
                        <option value="">시/도 선택</option>
                        <option th:each="sido : ${sidoList}"
                                th:value="${sido.code}"
                                th:text="${sido.name}"
                                th:selected="${sido.code == update.regionSidoCode}"></option>
                    </select>
                </div>
                <div>
                    <label for="regionSigunguCode">지역(시/군/구)</label>
                    <select name="regionSigunguCode" id="regionSigunguCode" class="form-select" required>
                        <option value="">시/군/구 선택</option>
                        <option th:each="sigungu : ${sigunguList}"
                                th:value="${sigungu.code}"
                                th:text="${sigungu.name}"
                                th:selected="${sigungu.code == update.regionSigunguCode}"></option>
                    </select>
                </div>
            </div>

            <!-- 3. 모집마감 날짜 + 모집 인원 -->
            <div class="recruit-field recruit-field-row recruit-field-row-narrow">
                <div>
                    <label for="applicationDeadline">모집마감 날짜 (수정 불가)</label>
                    <input type="date" name="applicationDeadline" id="applicationDeadline" class="form-control"
                           th:value="${update.applicationDeadline}" readonly required>
                </div>
                <div>
                    <label for="recruitmentCount">모집 인원</label>
                    <input type="number" name="recruitmentCount" id="recruitmentCount" class="form-control" min="0"
                           th:value="${update.recruitmentCount}" required>
                </div>
            </div>

            <!-- 4. 모집인력 종류 (생성 후에는 변경 불가: 서비스가 기존 카테고리로만 저장함) -->
            <div class="recruit-field">
                <label for="category">모집인력 종류</label>
                <select name="category" id="category" class="form-select" required disabled>
                    <option value="INDIVIDUAL" th:selected="${category.name() == 'INDIVIDUAL'}">알바</option>
                    <option value="FOOD_TRUCK" th:selected="${category.name() == 'FOOD_TRUCK'}">푸드트럭</option>
                    <option value="EQUIPMENT" th:selected="${category.name() == 'EQUIPMENT'}">장비</option>
                    <option value="ETC" th:selected="${category.name() == 'ETC'}">기타</option>
                </select>
                <input type="hidden" name="category" th:value="${category.name()}">
            </div>

            <!-- 4-1. 알바(INDIVIDUAL): 급여유형 + 급여 -->
            <div class="recruit-field recruit-field-row recruit-specific" data-category="INDIVIDUAL"
                 th:with="wageType=${category.name() == 'INDIVIDUAL'} ? ${update.specific.wageType} : null,
                          wageValue=${category.name() == 'INDIVIDUAL'} ? ${update.specific.wageValue} : null">
                <div>
                    <label for="wageType">급여유형</label>
                    <select name="wageType" id="wageType" class="form-select">
                        <option value="">급여유형 선택</option>
                        <option value="HOURLY" th:selected="${wageType != null and wageType.name() == 'HOURLY'}">시급</option>
                        <option value="DAILY" th:selected="${wageType != null and wageType.name() == 'DAILY'}">일급</option>
                        <option value="WEEKLY" th:selected="${wageType != null and wageType.name() == 'WEEKLY'}">주급</option>
                        <option value="PER_TASK" th:selected="${wageType != null and wageType.name() == 'PER_TASK'}">건당</option>
                    </select>
                </div>
                <div>
                    <label for="wageValue">급여(원)</label>
                    <input type="number" name="wageValue" id="wageValue" class="form-control" min="0" th:value="${wageValue}">
                </div>
            </div>

            <!-- 4-2. 푸드트럭(FOOD_TRUCK): 체크박스 -->
            <div class="recruit-specific" data-category="FOOD_TRUCK"
                 th:with="prepaid=${category.name() == 'FOOD_TRUCK'} ? ${update.specific.prepaid} : false,
                          boothFeeRequired=${category.name() == 'FOOD_TRUCK'} ? ${update.specific.boothFeeRequired} : false,
                          electricityProvided=${category.name() == 'FOOD_TRUCK'} ? ${update.specific.electricityProvided} : false">
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="prepaid" id="prepaid" value="true" th:checked="${prepaid}">
                    <input type="hidden" name="_prepaid" value="on">
                    <label class="form-check-label" for="prepaid">선결제</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="boothFeeRequired" id="boothFeeRequired" value="true" th:checked="${boothFeeRequired}">
                    <input type="hidden" name="_boothFeeRequired" value="on">
                    <label class="form-check-label" for="boothFeeRequired">입점료</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" class="form-check-input" name="electricityProvided" id="electricityProvided" value="true" th:checked="${electricityProvided}">
                    <input type="hidden" name="_electricityProvided" value="on">
                    <label class="form-check-label" for="electricityProvided">전기제공</label>
                </div>
            </div>

            <!-- 4-3. 장비/기타(EQUIPMENT, ETC): 업무내용에 안내 -->
            <p class="recruit-specific recruit-specific-note" data-category="EQUIPMENT">모집하는 장비 관련 내용을 아래 업무내용에 작성해주세요.</p>
            <p class="recruit-specific recruit-specific-note" data-category="ETC">모집 관련 세부 내용을 아래 업무내용에 작성해주세요.</p>

            <!-- 6. 근무 시간 (시/분을 고른 뒤 팝오버 안의 확인 버튼으로 확정) -->
            <div class="recruit-field recruit-field-row recruit-field-row-narrow">
                <div class="recruit-time-field">
                    <label for="workingStartTimeTrigger">근무 시작 시간</label>
                    <button type="button" class="form-control recruit-time-trigger" id="workingStartTimeTrigger"
                            th:text="${update.workingStartTime} ?: '시간을 선택하세요'">
                        시간을 선택하세요
                    </button>
                    <div class="recruit-time-popover" id="workingStartTimePopover" hidden>
                        <div class="recruit-time-selects">
                            <select id="workingStartHour"></select>시
                            <select id="workingStartMinute"></select>분
                        </div>
                        <button type="button" class="btn btn-sm btn-primary recruit-time-confirm" id="workingStartTimeConfirm">확인</button>
                    </div>
                </div>
                <div class="recruit-time-field">
                    <label for="workingEndTimeTrigger">근무 종료 시간</label>
                    <button type="button" class="form-control recruit-time-trigger" id="workingEndTimeTrigger"
                            th:text="${update.workingEndTime} ?: '시간을 선택하세요'">
                        시간을 선택하세요
                    </button>
                    <div class="recruit-time-popover" id="workingEndTimePopover" hidden>
                        <div class="recruit-time-selects">
                            <select id="workingEndHour"></select>시
                            <select id="workingEndMinute"></select>분
                        </div>
                        <button type="button" class="btn btn-sm btn-primary recruit-time-confirm" id="workingEndTimeConfirm">확인</button>
                    </div>
                </div>
            </div>
            <!-- 실제 폼 전송값: 팝오버에서 확인을 눌러야 채워짐 -->
            <input type="hidden" name="workingStartTime" id="workingStartTime" th:value="${update.workingStartTime}">
            <input type="hidden" name="workingEndTime" id="workingEndTime" th:value="${update.workingEndTime}">
            <p class="recruit-total-hours" id="totalHours">시간을 고른 뒤 확인 버튼을 눌러주세요.</p>

            <!-- 7. 근무 일자 -->
            <div class="recruit-field recruit-field-row recruit-field-row-narrow">
                <div>
                    <label for="workingStartDate">근무 시작일</label>
                    <input type="date" name="workingStartDate" id="workingStartDate" class="form-control"
                           th:value="${update.workingStartDate}" required>
                </div>
                <div>
                    <label for="workingEndDate">근무 종료일</label>
                    <input type="date" name="workingEndDate" id="workingEndDate" class="form-control"
                           th:value="${update.workingEndDate}" required>
                </div>
            </div>

            <!-- 8. 상세근무지 -->
            <div class="recruit-field">
                <label for="workingLocation">상세근무지</label>
                <input type="text" name="workingLocation" id="workingLocation" class="form-control" maxlength="255"
                       th:value="${update.workingLocation}">
            </div>

            <!-- 9. 모집공고 제목 -->
            <div class="recruit-field">
                <label for="recruitmentTitle">모집공고 제목</label>
                <input type="text" name="recruitmentTitle" id="recruitmentTitle" class="form-control" maxlength="100"
                       th:value="${update.recruitmentTitle}" required>
            </div>

            <!-- 10. 업무내용 (admin_board와 동일한 Toast UI 패턴) -->
            <div class="recruit-field">
                <label>업무내용</label>
                <input type="hidden" name="content" id="content">
                <textarea id="contentSource" hidden th:text="${update.content}"></textarea>
                <div id="editor"></div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a th:href="@{/recruitment/{id}(id=${recruitmentId})}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" id="btn" class="btn btn-primary">수정</button>
            </div>

        </form>

        <script th:src="@{/libs/toastui-editor-3.2.2/js/toastui-editor-all.min.js}"></script>
        <script th:src="@{/js/recruitment/recruitModify.js}"></script>
    </div>
</div>
</html>
