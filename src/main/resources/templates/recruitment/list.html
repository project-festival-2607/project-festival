<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/recruit/list.css}">
    </th:block>
</head>

<div layout:fragment="content" th:with="form=${pagingHandler.form}">
    <div class="container">

        <div class="recruit-list-head">
            <h1>모집공고</h1>
            <p>축제에서 함께 일할 사람을 찾아보세요.</p>
            <a th:if="${recruiter}" th:href="@{/recruitment/register}" class="btn recruit-write-btn">구인공고 등록</a>
        </div>

        <form th:action="@{/recruitment/list}" method="get" id="recruitFilterForm"
              th:classappend="${recruiter} ? 'recruit-layout recruit-layout-full' : 'recruit-layout'">

            <!-- 구직자/비로그인: 왼쪽 필터 사이드바. 구인자는 등록 버튼만 보고 필터는 보지 않음 -->
            <aside class="recruit-sidebar" th:unless="${recruiter}">
                <div class="recruit-sidebar-head">
                    <span>필터</span>
                    <a th:href="@{/recruitment/list}" class="recruit-filter-reset">초기화</a>
                </div>

                <div class="recruit-sidebar-section">
                    <label>키워드</label>
                    <input type="text" name="keywords" placeholder="제목/내용 검색" th:value="${form.keywords}">
                </div>

                <div class="recruit-sidebar-section">
                    <label>모집인력 종류</label>
                    <div class="recruit-chip-group" id="categoryChips">
                        <button type="button" class="recruit-chip" data-value="" th:classappend="${form.category == null} ? 'active'">전체</button>
                        <button type="button" class="recruit-chip" data-value="INDIVIDUAL" th:classappend="${form.category != null and form.category.name() == 'INDIVIDUAL'} ? 'active'">알바</button>
                        <button type="button" class="recruit-chip" data-value="FOOD_TRUCK" th:classappend="${form.category != null and form.category.name() == 'FOOD_TRUCK'} ? 'active'">푸드트럭</button>
                        <button type="button" class="recruit-chip" data-value="EQUIPMENT" th:classappend="${form.category != null and form.category.name() == 'EQUIPMENT'} ? 'active'">장비</button>
                        <button type="button" class="recruit-chip" data-value="ETC" th:classappend="${form.category != null and form.category.name() == 'ETC'} ? 'active'">기타</button>
                    </div>
                    <input type="hidden" name="category" id="filterCategory" th:value="${form.category}">
                </div>

                <div class="recruit-sidebar-section">
                    <label for="filterSido">지역</label>
                    <select name="regionSidoCode" id="filterSido">
                        <option value="">시/도 전체</option>
                        <option th:each="sido : ${sidoList}"
                                th:value="${sido.code}"
                                th:text="${sido.name}"
                                th:selected="${sido.code == form.regionSidoCode}"></option>
                    </select>
                    <select name="regionSigunguCode" id="filterSigungu" th:disabled="${form.regionSidoCode == null or form.regionSidoCode.isEmpty()}">
                        <option value="">시/군/구 전체</option>
                    </select>
                </div>

                <div class="recruit-sidebar-section">
                    <label>근무일자</label>
                    <div class="recruit-sidebar-row">
                        <input type="date" name="workingStartDate" id="workingStartDate" th:value="${form.workingStartDate}">
                        <span>~</span>
                        <input type="date" name="workingEndDate" id="workingEndDate" th:value="${form.workingEndDate}">
                    </div>
                </div>

                <div class="recruit-sidebar-section">
                    <label>근무시간</label>
                    <div class="recruit-sidebar-row">
                        <input type="time" name="workingStartTime" id="workingStartTime" th:value="${form.workingStartTime}">
                        <span>~</span>
                        <input type="time" name="workingEndTime" id="workingEndTime" th:value="${form.workingEndTime}">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary recruit-sidebar-apply">필터 적용</button>
            </aside>

            <div class="recruit-main">
                <div class="recruit-main-toolbar" th:unless="${recruiter}">
                    <span th:text="'총 ' + ${pagingHandler.totalElementCount} + '건'"></span>
                    <select name="listCriteria" id="listCriteria">
                        <option value="LATEST" th:selected="${form.listCriteria == null or form.listCriteria.name() == 'LATEST'}">최신순</option>
                        <option value="DEADLINE" th:selected="${form.listCriteria != null and form.listCriteria.name() == 'DEADLINE'}">마감임박순</option>
                        <option value="WAGE_HOURLY" class="recruit-wage-option" th:selected="${form.listCriteria != null and form.listCriteria.name() == 'WAGE_HOURLY'}">시급순</option>
                        <option value="WAGE_DAILY" class="recruit-wage-option" th:selected="${form.listCriteria != null and form.listCriteria.name() == 'WAGE_DAILY'}">일급순</option>
                        <option value="WAGE_WEEKLY" class="recruit-wage-option" th:selected="${form.listCriteria != null and form.listCriteria.name() == 'WAGE_WEEKLY'}">주급순</option>
                        <option value="WAGE_PER_TASK" class="recruit-wage-option" th:selected="${form.listCriteria != null and form.listCriteria.name() == 'WAGE_PER_TASK'}">건당순</option>
                    </select>
                </div>

                <div class="recruit-card-grid">
                    <a class="recruit-card" th:each="r : ${pagingHandler.elementList}" th:href="@{/recruitment/{id}(id=${r.recruitmentId})}">
                        <div class="recruit-card-top">
                            <span class="recruit-card-emoji" th:switch="${r.category != null ? r.category.name() : ''}">
                                <span th:case="'INDIVIDUAL'">🙋</span>
                                <span th:case="'FOOD_TRUCK'">🚚</span>
                                <span th:case="'EQUIPMENT'">🔧</span>
                                <span th:case="*">📦</span>
                            </span>
                            <span class="recruit-card-title" th:text="${r.recruitmentTitle}"></span>
                            <span class="recruit-card-bookmark" title="로그인 후 이용 가능">☆</span>
                        </div>
                        <div class="recruit-card-festival" th:text="${r.festivalTitle}"></div>
                        <div class="recruit-card-location"
                             th:text="${r.regionSidoName} + ' ' + ${r.regionSigunguName}"></div>
                        <div class="recruit-card-date">
                            <span th:text="${r.workingStartDate}"></span>
                            <span> ~ </span>
                            <span th:text="${r.applicationDeadline != null ? r.applicationDeadline : '상시모집'}"></span>
                        </div>
                        <div class="recruit-card-specific" th:switch="${r.category != null ? r.category.name() : ''}">
                            <span th:case="'INDIVIDUAL'" th:if="${r.specific != null}">
                                <span th:switch="${r.specific.wageType != null ? r.specific.wageType.name() : ''}">
                                    <span th:case="'HOURLY'">시급</span>
                                    <span th:case="'DAILY'">일급</span>
                                    <span th:case="'WEEKLY'">주급</span>
                                    <span th:case="'PER_TASK'">건당</span>
                                    <span th:case="*">협의</span>
                                </span>
                                <span th:if="${r.specific.wageValue != null}" th:text="${#numbers.formatInteger(r.specific.wageValue, 0, 'COMMA')} + '원'"></span>
                            </span>
                            <span th:case="'FOOD_TRUCK'" th:if="${r.specific != null}">
                                <span th:if="${r.specific.prepaid}" class="recruit-badge">선결제</span>
                                <span th:if="${r.specific.boothFeeRequired}" class="recruit-badge">입점료</span>
                                <span th:if="${r.specific.electricityProvided}" class="recruit-badge">전기제공</span>
                            </span>
                        </div>
                    </a>

                    <p class="recruit-card-empty" th:if="${pagingHandler.elementList.isEmpty()}">
                        조건에 맞는 모집공고가 없습니다.
                    </p>
                </div>

                <nav th:if="${pagingHandler.totalPageCount > 1}">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:if="${pagingHandler.prevBtnActive}">
                            <a class="page-link" th:href="@{/recruitment/list(pageIdx=${pagingHandler.startPageIdx - 1}, recruiter=${recruiter}, keywords=${form.keywords}, category=${form.category}, listCriteria=${form.listCriteria}, regionSidoCode=${form.regionSidoCode}, regionSigunguCode=${form.regionSigunguCode}, workingStartDate=${form.workingStartDate}, workingEndDate=${form.workingEndDate}, workingStartTime=${form.workingStartTime}, workingEndTime=${form.workingEndTime})}">이전</a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(pagingHandler.startPageIdx, pagingHandler.endPageIdx)}"
                            th:classappend="${i == pagingHandler.pageIdx} ? 'active'">
                            <a class="page-link" th:href="@{/recruitment/list(pageIdx=${i}, recruiter=${recruiter}, keywords=${form.keywords}, category=${form.category}, listCriteria=${form.listCriteria}, regionSidoCode=${form.regionSidoCode}, regionSigunguCode=${form.regionSigunguCode}, workingStartDate=${form.workingStartDate}, workingEndDate=${form.workingEndDate}, workingStartTime=${form.workingStartTime}, workingEndTime=${form.workingEndTime})}" th:text="${i}"></a>
                        </li>
                        <li class="page-item" th:if="${pagingHandler.nextBtnActive}">
                            <a class="page-link" th:href="@{/recruitment/list(pageIdx=${pagingHandler.endPageIdx + 1}, recruiter=${recruiter}, keywords=${form.keywords}, category=${form.category}, listCriteria=${form.listCriteria}, regionSidoCode=${form.regionSidoCode}, regionSigunguCode=${form.regionSigunguCode}, workingStartDate=${form.workingStartDate}, workingEndDate=${form.workingEndDate}, workingStartTime=${form.workingStartTime}, workingEndTime=${form.workingEndTime})}">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>

        </form>

        <script th:unless="${recruiter}"
                th:src="@{/js/recruitment/recruitList.js}"
                th:attr="data-sido=${form.regionSidoCode}, data-sigungu=${form.regionSigunguCode}"></script>

    </div>
</div>
</html>
