<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 400px;">
    <h1 class="mb-4 text-center mt-5">비밀번호 변경</h1>

    <div th:if="${FailureMsg != null}" class="alert alert-danger" role="alert">
        [[${FailureMsg}]]
    </div>

    <form th:action="@{/mypage/password-change}" method="post">
        <div class="mb-3">
            <label for="currentPassword" class="form-label">현재 비밀번호</label>
            <input type="password" class="form-control" id="currentPassword" name="currentPassword" required>
        </div>
        <div class="mb-3">
            <label for="newPassword" class="form-label">새 비밀번호</label>
            <input type="password" class="form-control" id="newPassword" name="newPassword" required>
        </div>
        <div class="mb-3">
            <label for="newPasswordConfirm" class="form-label">새 비밀번호 재입력</label>
            <input type="password" class="form-control" id="newPasswordConfirm" name="newPasswordConfirm" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">변경</button>
    </form>
</div>
</body>
</html>
