<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/member/signup-in.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="container up-in-container">
        <h1 class="up-in-h1">회원정보 수정</h1>

        <div th:if="${FailureMsg != null}" class="api-alert" role="alert">
            [[${FailureMsg}]]
        </div>

        <form th:action="@{/mypage/modify/employer}" method="post">
            <div class="basic-info-box">
                <input type="text" class="input id-input" id="username" th:value="${myPageDTO.username}" disabled>
                <input type="text" class="input id-input" id="name" th:value="${myPageDTO.name}" disabled>
            </div>

            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="phone" name="phone" th:value="${myPageDTO.phone}" placeholder="전화번호를입력하세요." required>
                    <button type="button" class="join-btn search-bn-btn" id="sendCodeBtn">인증번호 받기</button>
                </div>
            </div>
            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="code" maxlength="6" placeholder="인증번호입력">
                    <button type="button" class="join-btn search-bn-btn" id="verifyCodeBtn">확인</button>
                </div>
            </div>
            <input type="hidden" id="phoneVerificationToken" name="phoneVerificationToken">

            <div class="basic-info-box">
                <input type="text" class="input id-input" id="foundedAt" th:value="${myPageDTO.foundedAt}" placeholder="개업일자" disabled>
                <input type="email" class="input id-input" id="email" name="email" th:value="${myPageDTO.email}" placeholder="이메일" required>
                <input type="text" class="input id-input" id="companyName" name="companyName" th:value="${myPageDTO.companyName}" placeholder="회사명" required>
                <input type="text" class="input id-input" id="ceoName" name="ceoName" th:value="${myPageDTO.ceoName}" placeholder="대표자명" required>
                <input type="text" class="input id-input" id="streetAddress" name="streetAddress" th:value="${myPageDTO.streetAddress}" placeholder="주소" required>
                <input type="text" class="input id-input" id="detailAddress" name="detailAddress" th:value="${myPageDTO.detailAddress}" placeholder="상세주소">
            </div>


            <div class="mb-3">
                <label for="businessNumberDisplay" class="form-label">사업자등록번호</label>
                <div class="verify-group">
                    <input type="text" class="input id-input" id="businessNumberDisplay" inputmode="numeric"
                           placeholder="123-45-67890" maxlength="12" th:value="${myPageDTO.businessNumber}">
                    <button type="button" class="join-btn search-bn-btn" id="verifyBusinessNumberBtn">인증하기</button>
                </div>
            </div>
            <input type="hidden" id="businessNumber" name="businessNumber" th:value="${myPageDTO.businessNumber}">
            <input type="hidden" id="verificationToken" name="verificationToken">

            <button type="submit" class="save-btn">저장</button>
        </form>
    </div>
    <script th:src="@{/js/member/businessNumberVerify.js}"></script>
    <script th:src="@{/js/member/phoneVerify.js}"></script>
</div>
