<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<div layout:fragment="content">

    <!-- 기존 마이페이지 CSS -->
    <link rel="stylesheet" th:href="@{/css/mypage/recruiter/mypage.css}">

    <!-- 토스페이먼츠 SDK -->
    <script src="https://js.tosspayments.com/v2/standard"></script>


    <!-- =====================================================
         포인트 구매 모달 전용 CSS
         기존 .btn, .btn-primary 등의 CSS와 충돌하지 않도록
         전부 point-payment- 접두사 사용
         ===================================================== -->

    <style>

        .point-payment-backdrop {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);

            align-items: center;
            justify-content: center;
        }


        .point-payment-modal {
            background: white;
            width: 460px;
            max-width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            border-radius: 12px;
            box-sizing: border-box;
        }


        .point-payment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }


        .point-payment-title {
            margin: 0;
        }


        .point-payment-close {
            font-size: 24px;
            border: none;
            background: none;
            cursor: pointer;
            color: #8b95a1;
        }


        .point-payment-product-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 8px;
            border: 2px solid #e5e8eb;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
            text-align: left;
            font-size: 16px;
            transition: 0.15s;
            box-sizing: border-box;
        }

        .point-payment-product-item:hover {
            background: #f5f7fa;
        }

        .point-payment-product-item.selected {
            border-color: #3182f6;
            background: #eef4ff;
        }

        .point-payment-footer {
            margin-top: 20px;
        }

        .point-payment-next-btn,
        .point-payment-final-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 8px;
            background: #3182f6;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .point-payment-next-btn:disabled {
            background: #d1d6db;
            cursor: not-allowed;
        }

        .point-payment-back-btn {
            border: none;
            background: none;
            color: #8b95a1;
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 12px;
        }

        .point-payment-summary {
            background: #f5f7fa;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 16px;
            font-size: 15px;
        }

    </style>


    <!-- =====================================================
         기존 마이페이지
         ===================================================== -->

    <div class="container">

        <!-- 모든 inner는 class="container" 로 맞춤 -->

        <h1>마이페이지</h1>

        <div class="member-info">
            <div class="member-detail">
                <div>
                    <p>아이디</p>
                    <span th:text="${myPageDTO.username}"></span>
                </div>

                <div>
                    <p>이름</p>
                    <span th:text="${myPageDTO.name}"></span>
                </div>

                <div>
                    <p>전화번호</p>
                    <span th:text="${myPageDTO.phone}"></span>
                </div>

                <div>
                    <p>이메일</p>
                    <span th:text="${myPageDTO.email}"></span>
                </div>

                <div>
                    <p>포인트</p>
                    <span th:text="${myPageDTO.point}"></span>
                </div>

                <div>
                    <p>계정유형</p>
                    <span th:text="${myPageDTO.role}"></span>
                </div>
            </div>
            <!-- 기존 수정 버튼 -->
            <a th:if="${!myPageDTO.socialSignUp}" th:href="@{/mypage/password-check}" class="btn btn-primary">수정</a>

            <!-- =================================================
                 포인트 구매 버튼
                 기존 btn btn-primary CSS 그대로 사용
                 id만 추가
                 ================================================= -->

            <a th:if="${!myPageDTO.socialSignUp}"
               href="javascript:void(0)"
               id="openPointPaymentBtn"
               class="btn btn-primary">
                포인트 구매
            </a>

            <!-- 소셜 회원 수정 -->
            <a th:if="${myPageDTO.socialSignUp}" th:href="@{/mypage/modify/job-seeker}" class="btn btn-primary">수정</a>
        </div>

        <!-- 기존 메뉴 -->
        <div class="mypage-menu">
            <div class="menu-item" th:if="${!myPageDTO.socialSignUp}">
                <a th:href="@{/mypage/password-change}">비밀번호 변경</a>
            </div>
            <div class="menu-item">
                행사 진행중 상황
            </div>

            <div class="menu-item">
                행사 마감
            </div>

            <div class="menu-item">
                <a th:href="@{/application/recruiter/list(recruitmentId=${recruitment.id})}">
                    지원자 목록
                </a>
            </div>

            <div class="menu-item">
                <a th:href="@{/mypage/account-leave}">회원탈퇴</a>
            </div>
        </div>
    </div>


    <!-- 포인트 구매 모달창 -->

    <div id="pointPaymentBackdrop"
         class="point-payment-backdrop">
        <div class="point-payment-modal">
            <!-- 모달 헤더 -->
            <div class="point-payment-header">
                <h3 id="pointPaymentModalTitle"
                    class="point-payment-title">
                    포인트 구매
                </h3>
                <button type="button"
                        id="closePointPaymentBtn"
                        class="point-payment-close">
                    &times;
                </button>
            </div>


            <!-- STEP 1 상품 선택 -->
            <div id="pointPaymentStepSelect">
                <div id="pointPaymentProductList">
                    불러오는 중...
                </div>

                <div class="point-payment-footer">
                    <button type="button"
                            id="pointPaymentNextBtn"
                            class="point-payment-next-btn"
                            disabled>
                        결제하기
                    </button>
                </div>
            </div>


            <!-- STEP 2 토스 결제 위젯 -->
            <div id="pointPaymentStepPayment"
                 style="display:none;">

                <button type="button"
                        id="pointPaymentBackBtn"
                        class="point-payment-back-btn">
                    &larr; 상품 다시 선택
                </button>


                <!-- 선택한 상품 -->
                <div id="pointPaymentSummary"
                     class="point-payment-summary">
                </div>

                <!-- 토스 결제수단 -->
                <div id="pointPaymentMethod"></div>

                <!-- 토스 약관 -->
                <div id="pointPaymentAgreement"></div>


                <!-- 최종 결제 -->
                <div class="point-payment-footer">
                    <button type="button"
                            id="pointPaymentFinalBtn"
                            class="point-payment-final-btn">
                        결제하기
                    </button>
                </div>
            </div>
        </div>
    </div>


    <!-- 포인트 구매 JavaScript -->

    <script>
        // DOM
        const pointPaymentBackdrop = document.getElementById("pointPaymentBackdrop");
        const pointPaymentNextBtn = document.getElementById("pointPaymentNextBtn");
        const pointPaymentFinalBtn = document.getElementById("pointPaymentFinalBtn");
        const pointPaymentProductList = document.getElementById("pointPaymentProductList");
        const pointPaymentStepSelect = document.getElementById("pointPaymentStepSelect");
        const pointPaymentStepPayment = document.getElementById("pointPaymentStepPayment");
        const pointPaymentModalTitle = document.getElementById("pointPaymentModalTitle");
        const pointPaymentSummary = document.getElementById("pointPaymentSummary");

        // 상태값
        let selectedProduct = null;
        let widgets = null;

        // Toss 테스트 클라이언트 키
        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";


        // 랜덤 문자열 생성
        const generateRandomString = () => window.btoa(Math.random()).slice(0, 20);


        // 포인트 구매 버튼 클릭
        document
            .getElementById("openPointPaymentBtn")
            .addEventListener("click", async function () {
                resetPointPayment();
                pointPaymentBackdrop.style.display = "flex";
                await loadPointProducts();
            });


        // 닫기 버튼
        document
            .getElementById("closePointPaymentBtn")
            .addEventListener("click", closePointPayment);


        // 모달 바깥 클릭하면 닫기
        pointPaymentBackdrop.addEventListener(
            "click",
            function (event) {
                if (event.target === pointPaymentBackdrop) {
                    closePointPayment();
                }
            }
        );


        // 모달 닫기
        function closePointPayment() {
            pointPaymentBackdrop.style.display = "none";
        }


        // 처음 상태로 돌아가기
        function resetPointPayment() {
            selectedProduct = null;
            widgets = null;
            pointPaymentNextBtn.disabled = true;
            pointPaymentStepSelect.style.display = "block";
            pointPaymentStepPayment.style.display = "none";
            pointPaymentModalTitle.textContent = "포인트 구매";
            pointPaymentSummary.innerHTML = "";
        }


        // 상품 목록 가져오기
        async function loadPointProducts() {
            pointPaymentProductList.innerHTML =
                "불러오는 중...";
            try {
                const response = await fetch("/products");
                if (!response.ok) {
                    throw new Error(
                        "상품 목록 조회 실패"
                    );
                }
                const products = await response.json();
                pointPaymentProductList.innerHTML = "";


                // 상품이 없는 경우
                if (products.length === 0) {
                    pointPaymentProductList.innerHTML =
                        "등록된 상품이 없습니다.";
                    return;
                }


                // 포인트 적은 순으로 정렬
                products.sort(
                    (a, b) =>
                        a.pointGet - b.pointGet
                );

                // 상품 생성
                products.forEach(function (product) {
                    const item = document.createElement("button");
                    item.type = "button";
                    item.className = "point-payment-product-item";
                    item.innerHTML =
                        "<span>"
                        + product.productName
                        + "</span>"
                        +
                        "<b>"
                        + product.productPrice.toLocaleString()
                        + "원"
                        + "</b>";

                    item.addEventListener(
                        "click",
                        function () {
                            choosePointProduct(
                                product,
                                item
                            );
                        }
                    );

                    pointPaymentProductList.appendChild(item);

                });


            } catch (error) {
                console.error(error);
                pointPaymentProductList.innerHTML = "상품을 불러오지 못했습니다.";
            }
        }

        // 상품 선택
        function choosePointProduct(product, itemElement) {
            selectedProduct = product;
            // 기존 선택 제거
            document
                .querySelectorAll(
                    ".point-payment-product-item"
                )
                .forEach(function (element) {
                    element.classList.remove(
                        "selected"
                    );
                });


            // 현재 상품 선택
            itemElement.classList.add(
                "selected"
            );

            // 결제하기 버튼 활성화
            pointPaymentNextBtn.disabled = false;
        }


        // STEP 1 → STEP 2
        pointPaymentNextBtn.addEventListener(
            "click",
            async function () {
                if (!selectedProduct) {
                    return;
                }
                pointPaymentStepSelect.style.display = "none";
                pointPaymentStepPayment.style.display = "block";
                pointPaymentModalTitle.textContent = "결제하기";
                pointPaymentSummary.innerHTML =
                    "<b>"
                    + selectedProduct.productName
                    + "</b> · "
                    + selectedProduct.productPrice.toLocaleString()
                    + "원";
                try {
                    await renderPointPaymentWidget(
                        selectedProduct
                    );
                } catch (error) {
                    console.error(
                        "결제 위젯 렌더링 실패:",
                        error
                    );
                }
            }
        );


        // 상품 다시 선택
        document
            .getElementById("pointPaymentBackBtn")
            .addEventListener(
                "click",
                function () {
                    pointPaymentStepSelect.style.display = "block";
                    pointPaymentStepPayment.style.display = "none";
                    pointPaymentModalTitle.textContent = "포인트 구매";
                }
            );


        // Toss 결제 위젯 생성
        async function renderPointPaymentWidget(product) {
            const amount = {
                currency: "KRW",
                value: product.productPrice
            };


            widgets = TossPayments(clientKey)
                    .widgets({
                        customerKey:
                            generateRandomString()
                    });


            // 금액 설정
            await widgets.setAmount(amount);
            // 결제수단 + 약관 렌더링
            await Promise.all([
                widgets.renderPaymentMethods({
                    selector: "#pointPaymentMethod",
                    variantKey: "DEFAULT"
                }),


                widgets.renderAgreement({
                    selector: "#pointPaymentAgreement",
                    variantKey: "AGREEMENT"
                })
            ]);
        }


        // 최종 결제 버튼
        pointPaymentFinalBtn.addEventListener("click", async function () {
            if (!widgets || !selectedProduct) {
                    return;
                }
                try {
                    await widgets.requestPayment({
                        orderId: generateRandomString(),
                        orderName:
                        selectedProduct.productName,
                        successUrl: window.location.origin + "/widget/success",
                        failUrl: window.location.origin + "/fail",
                        customerEmail: "customer123@gmail.com",
                        customerName: "hoogil"
                    });

                } catch (error) {
                    console.error(
                        "결제 요청 실패:",
                        error
                    );

                }
            }
        );

    </script>

</div>

</html>
