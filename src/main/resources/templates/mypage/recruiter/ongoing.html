<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<div layout:fragment="content">
    <link rel="stylesheet" th:href="@{/css/mypage/recruiter/ongoing.css}">
    <div class="container">
<!--                모든 inner는 class="container" 로 맞춤        -->
<!--        이 안에서 작업        -->

        <div class="ongoing-page">
            <h1>공고 목록</h1>

            <!-- 진행 중인 행사가 없는 경우 -->
            <div class="ongoing-empty" th:if="${#lists.isEmpty(recruitments)}">
                <p>현재 진행 중인 행사가 없습니다.</p>
            </div>

            <!-- 진행 중인 행사가 있는 경우 -->
            <div class="ongoing-list" th:unless="${#lists.isEmpty(recruitments)}">
                <div class="ongoing-card" th:each="recruitment : ${recruitments}">

                    <h2 th:text="${recruitment.title}"> 행사 제목 </h2>

                    <div class="ongoing-info">
                        <p>
                            행사 기간 :
                            <span th:text="${recruitment.workingStartDate}"> 시작일 </span>
                            ~
                            <span th:text="${recruitment.workingEndDate}"> 종료일 </span>
                        </p>

                        <p>
                            근무 시간 :
                            <span th:text="${recruitment.workingStartTime}"> 시작 시간 </span>
                            ~
                            <span th:text="${recruitment.workingEndTime}"> 종료 시간 </span>
                        </p>

                        <p>
                            근무 장소 :
                            <span th:text="${recruitment.workingLocation}"> 근무 장소 </span>
                        </p>

                        <p>
                            모집 인원 :
                            <span th:text="${recruitment.recruitmentCount}"> 모집 인원 </span> 명
                        </p>

                        <a class="applicant-btn"
                           th:href="@{/application/recruiter/list(recruitmentId=${recruitment.id})}">
                            지원자 목록
                        </a>

                        <span class="ongoing-status">
                            ● 진행 중
                        </span>
                        <hr>
                    </div>
                </div>
            </div>
            <div class="ongoing-back">
                <a th:href="@{/mypage/recruiter}"> 마이페이지로 돌아가기 </a>
            </div>
        </div>
    </div>
</div>
