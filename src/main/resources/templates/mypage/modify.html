<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<div layout:fragment="content">
    <link rel="stylesheet" th:href="@{/css/mypage/modify.css}">
    <div class="container">
<!--                모든 inner는 class="container" 로 맞춤        -->
<!--        이 안에서 작업        -->
        <h1>개인정보수정</h1>

        <div class="modify-container">
            <div class="">
                <div>
                    <form th:action="@{/mypage/modify}" method="post">
                        <div class="form-group">
                            <label>아이디</label>
                            <input type="text" name="username" class="form-control" th:value="${myPageDTO.username}" readonly>
                        </div>

                        <div class="form-group">
                            <label>이름</label>
                            <input type="text" name="name" class="form-control" th:value="${myPageDTO.name}">
                        </div>

                        <div class="form-group">
                            <label>비밀번호</label>
                            <input type="password" name="password" class="form-control" placeholder="새 비밀번호">
                        </div>

                        <div class="form-group">
                            <label>전화번호</label>
                            <input type="text" name="phone" class="form-control" th:value="${myPageDTO.phone}">
                        </div>

                        <div class="form-group">
                            <label>이메일</label>
                            <input type="text" name="email" class="form-control" th:value="${myPageDTO.email}">
                        </div>

                        <div class="modify-buttons">
                            <button type="submit" class="btn btn-primary btn-sm modify-btn">수정</button>

                            <a th:href="@{/mypage}" class="cancel-btn"> 취소 </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
