<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>간편 로그인 관리</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 400px;">
    <h1 class="mb-4 text-center mt-5">간편 로그인 관리</h1>

    <div class="d-grid gap-2">
        <div class="d-flex justify-content-between align-items-center border rounded p-2">
            <span>구글</span>
            <a th:if="${!linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).GOOGLE)}"
               th:href="@{/mypage/social-login/google/link}" class="btn btn-outline-primary btn-sm">연동하기</a>
            <button th:if="${linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).GOOGLE)}"
                    type="button" class="btn btn-outline-danger btn-sm unlink-btn" data-provider="google">연동 해제</button>
        </div>

        <div class="d-flex justify-content-between align-items-center border rounded p-2">
            <span>네이버</span>
            <a th:if="${!linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).NAVER)}"
               th:href="@{/mypage/social-login/naver/link}" class="btn btn-outline-primary btn-sm">연동하기</a>
            <button th:if="${linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).NAVER)}"
                    type="button" class="btn btn-outline-danger btn-sm unlink-btn" data-provider="naver">연동 해제</button>
        </div>

        <div class="d-flex justify-content-between align-items-center border rounded p-2">
            <span>카카오</span>
            <a th:if="${!linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).KAKAO)}"
               th:href="@{/mypage/social-login/kakao/link}" class="btn btn-outline-primary btn-sm">연동하기</a>
            <button th:if="${linkedProviders.contains(T(com.example.chook.member.entity.enums.Provider).KAKAO)}"
                    type="button" class="btn btn-outline-danger btn-sm unlink-btn" data-provider="kakao">연동 해제</button>
        </div>
    </div>

    <div class="d-grid mt-3">
        <a th:href="@{/mypage}" class="btn btn-secondary">마이페이지로 돌아가기</a>
    </div>
</div>
<script th:src="@{/js/mypage/socialLogin.js}"></script>
</body>
</html>
