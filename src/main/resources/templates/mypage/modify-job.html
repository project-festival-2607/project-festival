<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/member/signup-in.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="container up-in-container">
        <h1 class="up-in-h1">회원정보 수정</h1>

        <div th:if="${FailureMsg != null}" class="api-alert" role="alert">
            [[${FailureMsg}]]
        </div>

        <form th:action="@{/mypage/modify/job-seeker}" method="post">
            <div class="basic-info-box">
                <input type="text" class="input id-input" id="username" th:value="${myPageDTO.username}" disabled>
                <input type="text" class="input id-input" id="name" th:value="${myPageDTO.name}" disabled>
                <input type="text" class="input id-input" id="gender" th:value="${myPageDTO.gender}" disabled>
                <input type="text" class="input id-input" id="birthDate" th:value="${myPageDTO.birthDate}" disabled>
            </div>

            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="phone" name="phone" th:value="${myPageDTO.phone}" placeholder="전화번호를입력하세요." required>
                    <button type="button" class="join-btn search-bn-btn" id="sendCodeBtn">인증번호 받기</button>
                </div>
            </div>
            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="code" maxlength="6" placeholder="인증번호입력">
                    <button type="button" class="join-btn search-bn-btn" id="verifyCodeBtn">확인</button>
                </div>
            </div>
            <input type="hidden" id="phoneVerificationToken" name="phoneVerificationToken">

            <div class="mb-3">
                <input type="email" class="input id-input" id="email" name="email" th:value="${myPageDTO.email}" required>
            </div>
            <div class="mb-3">
                <input type="text" class="input id-input" id="streetAddress" name="streetAddress" placeholder="주소" th:value="${myPageDTO.streetAddress}">
            </div>
            <div class="mb-3">
                <input type="text" class="input id-input" id="detailAddress" name="detailAddress" placeholder="상세주소" th:value="${myPageDTO.detailAddress}">
            </div>

            <hr class="my-4">

            <div th:if="${myPageDTO.role.name() == 'JOB_EQUIP'}" class="mb-3">
                <label class="form-label">현재 사업자등록번호</label>
                <input type="text" class="form-control" th:value="${myPageDTO.businessNumber}" disabled>
            </div>

            <div class="mb-3">
                <label for="businessNumberDisplay" class="form-label">
                    사업자등록번호 <span th:if="${myPageDTO.role.name() == 'JOB_EQUIP'}">변경</span><span th:unless="${myPageDTO.role.name() == 'JOB_EQUIP'}">추가 (선택)</span>
                </label>
                <div class="verify-group">
                    <input type="text" class="input id-input" id="businessNumberDisplay" inputmode="numeric" placeholder="123-45-67890" maxlength="12">
                    <button type="button" class="join-btn search-bn-btn" id="verifyBusinessNumberBtn">인증하기</button>
                </div>
            </div>
            <input type="hidden" id="businessNumber" name="businessNumber">
            <input type="hidden" id="verificationToken" name="verificationToken">

            <button type="submit" class="save-btn">저장</button>
        </form>

        <form th:if="${myPageDTO.role.name() == 'JOB_EQUIP'}" th:action="@{/mypage/business-number/delete}" method="post" class="mt-2"
              onsubmit="return confirm('사업자등록번호를 삭제하시겠습니까? JOB_SEEKER로 전환됩니다.');">
            <button type="submit" class="btn btn-outline-danger w-100">사업자등록번호 삭제</button>
        </form>
    </div>
    <script th:src="@{/js/member/businessNumberVerify.js}"></script>
    <script th:src="@{/js/member/phoneVerify.js}"></script>
</div>
