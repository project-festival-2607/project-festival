<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>축!</title>
  <!-- Bootstrap 설정 -->
  <link rel="stylesheet" th:href="@{/css/common.css}"/>
  <link rel="stylesheet" th:href="@{/css/index_main.css}"/>
  <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

  <!-- chatbot css -->
  <link rel="stylesheet" th:href="@{/css/chatbot/chatbot.css}">

  <script th:src="@{/libs/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<th:block th:replace="~{fragments/cursor :: mouseCursor}"></th:block>

<div th:replace="~{fragments/header :: header}"></div>
<div class="container-wrapper" style="padding-bottom: 30px; flex: 1;">
  <div layout:fragment="content"></div>
</div>

  <input type="hidden" id="csrfToken">
  <button id="chatBtn" class="chat-btn" style="z-index: 999;">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#4769e4" class="bi bi-chat-quote-fill" viewBox="0 0 16 16">
      <path d="M16 8c0 3.866-3.582 7-8 7a9 9 0 0 1-2.347-.306c-.584.296-1.925.864-4.181 1.234-.2.032-.352-.176-.273-.362.354-.836.674-1.95.77-2.966C.744 11.37 0 9.76 0 8c0-3.866 3.582-7 8-7s8 3.134 8 7M7.194 6.766a1.7 1.7 0 0 0-.227-.272 1.5 1.5 0 0 0-.469-.324l-.008-.004A1.8 1.8 0 0 0 5.734 6C4.776 6 4 6.746 4 7.667c0 .92.776 1.666 1.734 1.666.343 0 .662-.095.931-.26-.137.389-.39.804-.81 1.22a.405.405 0 0 0 .011.59c.173.16.447.155.614-.01 1.334-1.329 1.37-2.758.941-3.706a2.5 2.5 0 0 0-.227-.4zM11 9.073c-.136.389-.39.804-.81 1.22a.405.405 0 0 0 .012.59c.172.16.446.155.613-.01 1.334-1.329 1.37-2.758.942-3.706a2.5 2.5 0 0 0-.228-.4 1.7 1.7 0 0 0-.227-.273 1.5 1.5 0 0 0-.469-.324l-.008-.004A1.8 1.8 0 0 0 10.07 6c-.957 0-1.734.746-1.734 1.667 0 .92.777 1.666 1.734 1.666.343 0 .662-.095.931-.26z"/>
    </svg>
  </button>
  <!-- 채팅창 -->
  <div id="chatBox" class="chat-box">

    <div class="chat-header">
      <span>ChatBot</span>
      <button id="closeBtn">✖</button>
    </div>

    <div class="chat-body">
      안녕하세요!<br>
      무엇을 도와드릴까요?
    </div>

    <!-- 입력창 -->
    <div class="chat-input">
      <input type="text" id="message" placeholder="메시지를 입력하세요">
      <button id="sendBtn">전송</button>
    </div>

  </div>

  <!-- chatbot js -->
  <script th:src="@{/js/chatbot/chatbot.js}"></script>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
