<!DOCTYPE html>
<html lang="ko"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <title>축!</title>
  <!-- Bootstrap 설정 -->
  <link rel="stylesheet" th:href="@{/css/common.css}"/>
  <link rel="stylesheet" th:href="@{/css/index_main.css}"/>
  <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

  <!-- chatbot css -->
  <link rel="stylesheet" th:href="@{/css/chatbot/chatbot.css}">

  <script th:src="@{/libs/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body class="d-flex flex-column min-vh-100">

<th:block th:replace="~{fragments/cursor :: mouseCursor}"></th:block>

<div th:replace="~{fragments/header :: header}"></div>
<div class="container-wrapper" style="padding-bottom: 30px; flex: 1;">
  <div layout:fragment="content"></div>
</div>

  <input type="hidden" id="csrfToken">
  <button id="chatBtn" class="chat-btn" style="z-index: 999;">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#DC3545" class="bi bi-android2" viewBox="0 0 16 16">

    </svg>
  </button>
  <!-- 채팅창 -->
  <div id="chatBox" class="chat-box" style="z-index: 999;">

    <div class="chat-header">
      <span>축정기(당신의 도우미)</span>
      <button id="closeBtn">✖</button>
    </div>

    <div class="chat-body">
      <div class="chat-hi">
        안녕하세요! 저는 chook정기예요.<br>
        무엇을 도와드릴까요? <br>
      </div>
    </div>

    <!-- 입력창 -->
    <div class="chat-input">
      <input type="text" id="message" placeholder="메시지를 입력하세요">
      <button id="sendBtn">전송</button>
    </div>

  </div>

  <!-- chatbot js -->
  <script th:src="@{/js/chatbot/chatbot.js}"></script>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
