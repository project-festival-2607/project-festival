<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/libs/toastui-editor-3.2.2/css/toastui-editor.min.css}" />
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <!--                모든 inner는 class="container" 로 맞춤        -->
        <!--        이 안에서 작업        -->
        <h1>공지사항</h1>

        <div class="mb-3">
            <input type="text" class="form-control" id="title" th:value="${board.title}" th:readonly="${!isAdmin}">
        </div>
        <div class="mb-3">
            <input type="text" class="form-control" value="작성자" readonly>
        </div>

        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="highlight" th:checked="${board.highlight}" th:disabled="${!isAdmin}">
            <label class="form-check-label" for="highlight">하이라이트</label>
        </div>

        <!-- 서버가 내려준 마크다운 원본 (에디터/뷰어 초기화용, 화면에는 안 보임) -->
        <textarea id="content" style="display:none" th:text="${board.content}"></textarea>

        <!-- admin이면 바로 수정 가능한 에디터(저장 버튼은 아직 미구현), 아니면 읽기 전용 뷰어 -->
        <div id="editor" th:attr="data-admin=${isAdmin}"></div>

        <div class="d-flex justify-content-end gap-2 mt-3">
            <a th:href="@{/adminBoard/list}" class="btn btn-outline-secondary">목록</a>
        </div>

        <script th:src="@{/libs/toastui-editor-3.2.2/js/toastui-editor-all.min.js}"></script>

        <script th:src="@{/js/support/adminBoardDetail.js}"></script>
    </div>
</div>
</body>
</html>
