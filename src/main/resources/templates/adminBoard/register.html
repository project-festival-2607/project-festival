<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/libs/toastui-editor-3.2.2/css/toastui-editor.min.css}" />
</head>

<body>
<div layout:fragment="content">
    <div class="container">
        <!--                모든 inner는 class="container" 로 맞춤        -->
        <!--        이 안에서 작업        -->
    <h1>Register Page</h1>

        <form th:action="@{/adminBoard/register}" method="post">
            <input placeholder="제목">
            <input value="작성자" readonly>

            <!-- 토스트 에디터 구현-->
            <div id="editor">

            </div>

            <div class="d-flex justify-content-end gap-2 mt-3">
                <a th:href="@{/adminBoard/list}" class="btn btn-outline-secondary">취소</a>
                <button type="submit" id="btn" class="btn btn-primary">전송</button>
            </div>

        </form>

        <script th:src="@{/libs/toastui-editor-3.2.2/js/toastui-editor-all.min.js}"></script>

        <script>
            const editor = new toastui.Editor({
                el: document.querySelector('#editor'),
                previewStyle: 'vertical',
                height: '500px',
                initialEditType: 'wysiwyg',
                hideModeSwitch: true
            });

            const btn = document.getElementById("btn");
            const title = document.querySelector("form input");

            async function editorHandler(e){
                e.preventDefault();

                const content = editor.getMarkdown();
                const titleValue = title.value;

                const res = await fetch("/adminBoard/register", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({title: titleValue, content})
                });

                // 확인용: 컨트롤러가 받아서 그대로 echo한 값이 응답으로 오는지 체크
                console.log("status:", res.status);
                console.log("echo from controller:", await res.json());
            }

            btn.addEventListener("click", editorHandler);

        </script>
    </div>
</div>
</body>
</html>
