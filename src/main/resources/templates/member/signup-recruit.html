<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>구인자 회원가입</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <h1 class="mb-4 text-center mt-5">구인자 회원가입</h1>

    <div th:if="${FailureMsg != null}" class="alert alert-danger" role="alert">
        [[${FailureMsg}]]
    </div>

    <form th:action="@{/member/signup/employer}" method="post">
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" name="password" required>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">전화번호</label>
            <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" required>
        </div>
        <div class="mb-3">
            <label for="companyName" class="form-label">회사명</label>
            <input type="text" class="form-control" id="companyName" name="companyName" required>
        </div>
        <div class="mb-3">
            <label for="ceoName" class="form-label">대표자명</label>
            <input type="text" class="form-control" id="ceoName" name="ceoName" required>
        </div>
        <div class="mb-3">
            <label for="streetAddress" class="form-label">주소</label>
            <input type="text" class="form-control" id="streetAddress" name="streetAddress" required>
        </div>
        <div class="mb-3">
            <label for="detailAddress" class="form-label">상세주소</label>
            <input type="text" class="form-control" id="detailAddress" name="detailAddress">
        </div>
        <div class="mb-3">
            <label for="foundedAt" class="form-label">개업일자</label>
            <input type="date" class="form-control" id="foundedAt" name="foundedAt" required>
        </div>

        <hr class="my-4">

        <div class="mb-3">
            <label for="businessNumberDisplay" class="form-label">사업자등록번호</label>
            <div class="input-group">
                <input type="text" class="form-control" id="businessNumberDisplay" inputmode="numeric" placeholder="123-45-67890" maxlength="12" required>
                <button type="button" class="btn btn-outline-secondary" id="verifyBusinessNumberBtn">인증하기</button>
            </div>
        </div>
        <input type="hidden" id="businessNumber" name="businessNumber">
        <input type="hidden" id="verificationToken" name="verificationToken">

        <button type="submit" class="btn btn-primary w-100 mt-3">가입하기</button>
    </form>
</div>
<script th:src="@{/js/member/businessNumberVerify.js}"></script>
</body>
</html>
