<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 찾기</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 400px;">
    <h1 class="mb-4 text-center mt-5">비밀번호 찾기</h1>

    <div th:if="${FailureMsg != null}" class="alert alert-danger" role="alert">
        [[${FailureMsg}]]
    </div>

    <form th:action="@{/member/find-password}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <div class="mb-3">
            <label for="username" class="form-label">아이디</label>
            <input type="text" class="form-control" id="username" name="username" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">전화번호</label>
            <div class="input-group">
                <input type="text" class="form-control" id="phone" name="phone" required>
                <button type="button" class="btn btn-outline-secondary" id="sendCodeBtn">인증번호 받기</button>
            </div>
        </div>
        <div class="mb-3">
            <label for="code" class="form-label">인증번호</label>
            <div class="input-group">
                <input type="text" class="form-control" id="code" maxlength="6">
                <button type="button" class="btn btn-outline-secondary" id="verifyCodeBtn">확인</button>
            </div>
        </div>
        <input type="hidden" id="phoneVerificationToken" name="phoneVerificationToken">

        <button type="submit" class="btn btn-primary w-100 mt-3">확인</button>
    </form>
</div>
<script th:src="@{/js/member/phoneVerify.js}"></script>
</body>
</html>
