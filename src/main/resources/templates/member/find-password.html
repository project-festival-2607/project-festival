<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/member/signup-in.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="container up-in-container">
        <h1 class="up-in-h1">비밀번호 찾기</h1>

        <div th:if="${FailureMsg != null}" class="api-alert" role="alert">
            [[${FailureMsg}]]
        </div>

        <form th:action="@{/member/find-password}" method="post">
            <div class="basic-info-box">
                <input type="text" class="input id-input" id="name" name="name" placeholder="이름을입력하세요." required>
                <input type="text" class="input id-input" id="username" name="username" placeholder="아이디를입력하세요." required>
            </div>

            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="phone" name="phone" placeholder="전화번호를입력하세요." required>
                    <button type="button" class="join-btn search-bn-btn" id="sendCodeBtn">인증번호 받기</button>
                </div>
            </div>
            <div class="mb-3">
                <div class="verify-group">
                    <input type="text" class="input id-input" id="code" maxlength="6" placeholder="인증번호입력">
                    <button type="button" class="join-btn search-bn-btn" id="verifyCodeBtn">확인</button>
                </div>
            </div>
            <input type="hidden" id="phoneVerificationToken" name="phoneVerificationToken">

            <button type="submit" class="join-btn signup-btn">비밀번호찾기</button>
        </form>
    </div>
    <script th:src="@{/js/member/phoneVerify.js}"></script>
</div>
