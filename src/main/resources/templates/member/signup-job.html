<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>구직자 회원가입</title>
    <link rel="stylesheet" th:href="@{/libs/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
</head>
<body>
<div class="container" style="max-width: 500px;">
    <h1 class="mb-4 text-center mt-5">구직자 회원가입</h1>

    <div th:if="${FailureMsg != null}" class="alert alert-danger" role="alert">
        [[${FailureMsg}]]
    </div>

    <form th:action="${isSocial} ? @{/member/signup/social} : @{/member/signup/job-seeker}" method="post">
        <div th:unless="${isSocial}">
            <div class="mb-3">
                <label for="userName" class="form-label">아이디</label>
                <input type="text" class="form-control" id="userName" name="userName" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">비밀번호</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="password-check" class="form-label">비밀번호 확인</label>
                <input type="password" class="form-control" id="password-check" name="password-check" required>
            </div>
        </div>
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text" class="form-control" id="name" name="name" th:value="${prefillName}" required>
        </div>
        <div class="mb-3">
            <label for="phone" class="form-label">전화번호</label>
            <input type="text" class="form-control" id="phone" name="phone" required>
        </div>
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email" class="form-control" id="email" name="email" th:value="${prefillEmail}" required>
        </div>
        <div class="mb-3">
            <label for="gender" class="form-label">성별</label>
            <select class="form-select" id="gender" name="gender" required>
                <option value="" selected disabled>선택</option>
                <option value="MALE">남성</option>
                <option value="FEMALE">여성</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="birthDate" class="form-label">생년월일</label>
            <input type="date" class="form-control" id="birthDate" name="birthDate" required>
        </div>
        <div class="mb-3">
            <label for="streetAddress" class="form-label">주소</label>
            <input type="text" class="form-control" id="streetAddress" name="streetAddress">
        </div>
        <div class="mb-3">
            <label for="detailAddress" class="form-label">상세주소</label>
            <input type="text" class="form-control" id="detailAddress" name="detailAddress">
        </div>

        <hr class="my-4">

        <div class="mb-3">
            <label for="businessNumberDisplay" class="form-label">사업자등록번호 (선택)</label>
            <div class="input-group">
                <input type="text" class="form-control" id="businessNumberDisplay" inputmode="numeric" placeholder="123-45-67890" maxlength="12">
                <button type="button" class="btn btn-outline-secondary" id="verifyBusinessNumberBtn">인증하기</button>
            </div>
        </div>
        <input type="hidden" id="businessNumber" name="businessNumber">
        <input type="hidden" id="verificationToken" name="verificationToken">

        <button type="submit" class="btn btn-primary w-100 mt-3">가입하기</button>
    </form>
</div>
<script th:src="@{/js/member/businessNumberVerify.js}"></script>
</body>
</html>
