<!DOCTYPE html>
<html lang="ko"
      layout:decorate="~{layout/layout}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/member/signup-in.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <div class="container up-in-container">
        <h1 class="up-in-h1">비밀번호 재설정</h1>

        <div th:if="${FailureMsg != null}" class="api-alert" role="alert">
            [[${FailureMsg}]]
        </div>

        <form th:action="@{/member/reset-password}" method="post">
            <div class="basic-info-box">
                <input type="password" class="input id-input" id="newPassword" name="newPassword" placeholder="재설정할 비밀번호" required>
                <input type="password" class="input id-input" id="newPasswordConfirm" name="newPasswordConfirm" placeholder="비밀번호 확인" required>
            </div>
            <button type="submit" class="join-btn signup-btn">재설정</button>
        </form>
    </div>
</div>
