<!DOCTYPE html>
<html lang="ko">
<!---->
<head>
  <meta charset="utf-8"/>

  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>결제 완료</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      font-family:
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .payment-complete-box {
      width: 500px;
      max-width: 90%;
      background: white;
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .check-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #3182f6;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: bold;
    }

    h2 {
      margin: 0 0 30px;
      color: #191f28;
      font-size: 26px;
    }

    .payment-info {
      background: #f5f7fa;
      border-radius: 10px;
      padding: 18px;
      margin-bottom: 30px;
      text-align: left;
    }

    .payment-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .payment-label {
      color: #8b95a1;
      font-size: 15px;
    }

    .payment-value {
      color: #191f28;
      font-size: 18px;
      font-weight: bold;
    }

    .back-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 8px;
      background: #3182f6;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button:hover {
      background: #1b64da;
    }

    .error-message {
      margin-top: 15px;
      color: #f04452;
      font-size: 14px;
    }

  </style>
</head>


<body>
<div class="payment-complete-box">
  <!-- 결제 완료 -->
  <div class="check-icon">✓</div>

  <h2>
    결제를 완료했어요
  </h2>

  <!-- 결제 금액 -->
  <div class="payment-info">
    <div class="payment-row">
            <span class="payment-label">
                결제금액
            </span>
      <span class="payment-value" id="amount"></span>
    </div>
  </div>

  <!-- 원래 페이지로 돌아가기 -->
  <button type="button" class="back-button" onclick="goBack()">마이페이지로 돌아가기</button>


  <!-- 승인 실패 메시지 본적은 없긴함-->
  <div
          id="errorMessage"
          class="error-message"
          style="display:none;">
  </div>


</div>


<script>
  // URL 파라미터
  const urlParams = new URLSearchParams(window.location.search);
  const paymentKey = urlParams.get("paymentKey");
  const orderId = urlParams.get("orderId");
  const amount = urlParams.get("amount");


  // 결제 금액 표시
  if (amount) {
    document.getElementById("amount")
            .textContent
            = Number(amount).toLocaleString() + "원";

  } else {
    document.getElementById("amount")
            .textContent
            = "-";
  }


  // 결제 승인
  async function confirmPayment() {
    try {
      const requestData = {
        paymentKey: paymentKey,
        orderId: orderId,
        amount: amount
      };


      const response = await fetch("/confirm/widget",
                      {
                        method: "POST",
                        headers: {
                          "Content-Type": "application/json"
                        },
                        body: JSON.stringify(requestData)
                      }
              );


      const json = await response.json();

      if (!response.ok) {
        throw new Error(json.message || "결제 승인에 실패했습니다.");
      }
      console.log("결제 승인 성공", json);

    } catch (error) {
      console.error("결제 승인 실패:", error);

      const errorMessage = document.getElementById("errorMessage");

      errorMessage.textContent = error.message;
      errorMessage.style.display = "block";
    }
  }



  // 페이지가 열리면 결제 승인
  confirmPayment();


  // 원래 페이지로 돌아가기
  function goBack() {
    window.location.href = "/mypage";

  }

</script>

</body>

</html>
