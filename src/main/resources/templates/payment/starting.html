<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>포인트 메인</title>
    <link rel="stylesheet" href="/css/payment/style.css">

    <style>
        .menu-buttons {
            margin-top: 30px;
        }

        .button,
        .button2 {
            display: block;
            width: 100%;
            height: 60px;
            margin-top: 20px;
            border-radius: 8px;
            text-align: center;
            line-height: 60px;
            box-sizing: border-box;
            text-decoration: none;
        }


        .button {
            border: none;
            cursor: pointer;
        }

        #memberSelect {
            width:100%;
            height:60px;
            font-size:24px;
            margin-top:30px;
            border-radius:8px;
            border:1px solid #d1d6db;
            padding:0 12px;
        }

        #loginError {
            color:#f04452;
            margin-top:15px;
            display:none;
        }
    </style>

</head>
<body>
<div class="wrapper">
    <div class="box_section">
        <h1 class="title">
            포인트 관리
        </h1>

        <!-- 회원 선택 -->
        <select id="memberSelect">
            <option value="">
                불러오는 중...
            </option>
        </select>

        <div id="loginError">
            결제 권한이 없는 회원입니다.
        </div>

        <div class="menu-buttons">
            <button id="paymentBtn" class="button">
                테스트하기
            </button>
        </div>

    </div>

</div>

<script>
    // 결제 가능한 회원 목록 불러오기
    async function loadEligibleMembers() {
        const select = document.getElementById("memberSelect");
        try {
            const res = await fetch("/login-test/eligible-members");
            const members = await res.json();
            select.innerHTML = "";
            if(members.length === 0) {
                select.innerHTML =
                    "<option value=''>결제 가능한 회원이 없습니다</option>";
                return;
            }

            members.forEach(function(m){
                const option = document.createElement("option");
                option.value = m.id;
                option.textContent = m.name + " (" + m.username + ")";
                select.appendChild(option);
            });
        } catch(e) {
            select.innerHTML = "<option value=''>목록을 불러오지 못했습니다</option>";
        }

    }
    // 페이지 실행
    loadEligibleMembers();

    // 결제 버튼
    document
        .getElementById("paymentBtn")
        .addEventListener("click", async ()=>{
            const memberId = document.getElementById("memberSelect").value;
            const errorEl = document.getElementById("loginError");
            errorEl.style.display = "none";
            if(!memberId){
                alert("회원을 선택해주세요.");
                return;
            }
            const response = await fetch("/login-test", {
                method:"POST",
                headers:{
                    "Content-Type": "application/x-www-form-urlencoded"
                },
                body: "memberId=" + memberId
            });

            if(response.ok){
                location.href="/payCreationTest";
            }else{
                errorEl.style.display =
                    "block";
            }
        });

</script>
<!--결제생성 테스트 버튼인데 이젠 테스트하기 버튼이랑 같은 기능이 되서 없애버림.-->
<!--&lt;!&ndash; 누르는 순간 test_member로 자동 로그인 처리된 후 결제 생성 테스트 페이지로 이동 &ndash;&gt;-->
<!--<a href="/login-test/quick"-->
<!--   class="button2">-->
<!--    🧪 결제 생성 테스트 (test_member로 자동 로그인)-->
<!--</a>-->


</body>
</html>
